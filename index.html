<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Spark Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a bright, chunky phone game for apprentice electricians; playful but the facts are exact.
IDEA: a job-site work order board: take jobs, earn pay, climb from apprentice to journeyman.
PICTURE: each job is a cartoon play surface (receptacle, floor plan, tile grid, live panel).
COLOUR and TYPE: sky blue ground, safety yellow, ink outlines with hard drop shadows; Fredoka.
LAYOUT: one 480px column, HUD on top, cards stacked, big tap targets.
*/
:root{--sky:#5EC8F2;--ink:#1B2A41;--yel:#FFC93C;--org:#FF8A3D;--grn:#35C76F;--red:#FF5A5A;--pap:#FFF8E7;--blu:#2F7FE0;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:17px/1.45 Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--sky);min-height:100vh;overflow-x:clip}
body::before{content:"";position:fixed;inset:auto 0 0 0;height:90px;background:#6FD08C;border-top:4px solid var(--ink);z-index:-1}
#app{max-width:480px;margin:0 auto;padding:12px 12px 110px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font-weight:600;font-size:18px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;min-height:50px;background:var(--yel);color:var(--ink);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:#fff}.btn.go{background:var(--grn)}.btn.sm{min-height:42px;font-size:15px;padding:6px 12px}
.btn.big{font-size:24px;padding:14px 28px;min-height:62px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:14px}
.rank{display:flex;align-items:center;gap:8px;flex:1}
.rank svg{width:40px;height:40px;flex:none}
.rank small{display:block;font-size:13px;opacity:.7;line-height:1}.rank b{font-weight:600;font-size:16px;line-height:1.15}
.cash{font-weight:700;font-size:20px;background:var(--grn);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;-webkit-text-stroke:.5px var(--ink)}
.mute{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:var(--pap);display:grid;place-items:center;padding:0}
.mute svg{width:24px;height:24px}
.sec{font-size:26px;font-weight:700;margin:4px 4px 10px;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.job{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px 12px;background:#fff;position:relative;overflow:hidden}
.job::before{content:"";position:absolute;inset:0 0 auto 0;height:58px;background:var(--c);border-bottom:3px solid var(--ink)}
.job:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.jic{position:relative;width:50px;height:50px;margin-bottom:12px}.jic svg{width:100%;height:100%}
.kind{font-size:13px;font-weight:600;text-transform:none;opacity:.7}
.jt{font-weight:600;font-size:16px;line-height:1.2;margin:2px 0 6px;min-height:2.4em}
.pay{font-weight:700;color:#1E8C4C}
.stars{display:flex;gap:2px;margin-top:4px}.stars svg{width:20px;height:20px}
.stars.lg{justify-content:center;gap:6px;margin:6px 0}.stars.lg svg{width:52px;height:52px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:3px solid var(--ink);border-radius:12px;background:#fff;min-height:44px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--ink)}.tab.on{background:var(--yel)}.tab:disabled{opacity:.5;box-shadow:none}
.roster{display:grid;gap:8px}
.mem{display:flex;align-items:center;gap:10px;padding:8px 10px;box-shadow:0 3px 0 var(--ink)}
.mem.me{background:#FFF3C4}
.pos{font-weight:700;width:22px;text-align:center;flex:none}
.av{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.mi{flex:1}.mi b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}.mi em{font-style:normal;font-size:12px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:2px}.mi small{font-size:14px;opacity:.75}
.ms{display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}.ms .stars{margin:0}
.news{padding:4px 12px}.nw{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed #D3D9E0}.nw:last-child{border:0}.nw small{white-space:nowrap;opacity:.7;font-size:13px}
.exam{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px;text-align:left;background:var(--pap)}
.exam svg{width:52px;height:52px;flex:none}.exam b{font-size:19px;font-weight:600;display:block}.exam small{font-size:14px}
.exam.locked{opacity:.65}
.fine{text-align:center;font-size:13px;color:var(--ink);margin-top:18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tag{font-weight:600;font-size:15px;background:var(--c);border:3px solid var(--ink);border-radius:999px;padding:4px 12px}
.order{padding:10px 14px;margin-bottom:12px;background:var(--pap)}
.order b{font-size:14px;font-weight:600;opacity:.65}.order p{margin:2px 0 0;font-size:16px}
.stage{padding:8px;margin-bottom:12px;background:#E8F7FF}
.stage svg{display:block;width:100%;height:auto;touch-action:manipulation}
.msg{min-height:24px;font-size:16px;margin:12px 2px 0}
.msg.bad{background:#FFE3E3;border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.msg.ok{background:#DDF7E6;border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{flex:1 1 30%;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 8px;font-size:15px;font-weight:500;min-height:46px;display:flex;align-items:center;gap:6px;justify-content:center}
.chip i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.chip.sel{background:var(--yel);transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.meter{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:12px;background:var(--yel)}
.lcd{flex:none;width:118px;background:#C8E6B0;border:3px solid var(--ink);border-radius:10px;font:700 28px/1 "Courier New",monospace;text-align:center;padding:10px 4px}
.meter p{margin:0;font-size:15px}
.opts{display:grid;gap:10px}
.opts .btn{text-align:left;font-size:17px;background:#fff}
.opts .btn.right{background:#BFF0CF}.opts .btn.wrong{background:#FFC9C9}
.hint{font-size:15px;margin:0 2px 10px}
.circ{padding:10px;margin-bottom:10px;transition:background .2s}
.circ.over{background:#FFE1E1;animation:wob .35s infinite alternate}
.circ.trip{background:#D8DCE2}
@media (prefers-reduced-motion:reduce){.circ.over{animation:none}}
@keyframes wob{to{transform:translateX(2px)}}
.ch{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.ch span{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:6px 0}
.bar div{height:100%;transition:width .15s}
.fuse{height:8px;border-radius:9px;background:var(--red);margin-bottom:6px}
.loads{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.ld{border:3px solid var(--ink);border-radius:10px;background:var(--pap);font-size:14px;font-weight:500;padding:4px 8px;min-height:38px;white-space:nowrap}
.ld.hot{background:#FFD3A8}
.gamehud{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px;margin-bottom:10px;padding:8px 12px}
.hearts svg{width:26px;height:26px;margin-left:2px}
.qcard{padding:16px;margin-bottom:12px}
.qcard h3{margin:0 0 4px;font-size:15px;font-weight:600;opacity:.65}
.qcard p.q{font-size:20px;font-weight:500;margin:0;line-height:1.3}
.dots{display:flex;gap:5px;justify-content:center;margin:0 0 10px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.r{background:var(--grn)}.dots i.w{background:var(--red)}.dots i.c{background:var(--yel)}
.expl{margin-top:12px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--pap);font-size:16px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:grid;gap:10px}
.mb{border:3px solid var(--ink);border-radius:14px;background:#fff;min-height:58px;padding:6px 8px;font-size:15px;font-weight:500;box-shadow:0 3px 0 var(--ink)}
.mb.sel{background:var(--yel)}.mb.done{background:#BFF0CF;opacity:.7;box-shadow:none}.mb.no{background:#FFC9C9;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.modal{position:fixed;inset:0;background:#1B2A41aa;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.res{width:min(420px,100%);padding:18px;text-align:center;background:#fff}
.res h2{font-size:30px;margin:0;font-weight:700}
.earn{font-size:30px;font-weight:700;color:#1E8C4C;margin:2px 0 8px}
.why{text-align:left;background:var(--pap);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.why b{font-weight:600}.why p{margin:4px 0 0;font-size:16px}
.title{text-align:center;padding-top:6vh}
.title svg.logo{width:150px;height:150px}
.title h1{font-size:60px;line-height:1;margin:6px 0 4px;color:var(--yel);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);font-weight:700}
.title p{font-size:19px;font-weight:500;margin:6px auto 22px;max-width:320px}
.link{background:none;border:0;text-decoration:underline;font-size:15px;margin-top:16px;display:block;margin-inline:auto;min-height:44px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf{position:absolute;top:-20px;width:12px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.pulse{animation:pl .8s infinite alternate}
@keyframes pl{to{opacity:.35}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
{
const $=s=>document.querySelector(s);
const app=$('#app');
const INK='#1B2A41';
const KEY='sparkup-v1';
let S={cash:0,xp:0,year:1,stars:{},exams:{},mute:false,view:0};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=Object.assign(S,d)}catch(e){}
if(!S.exams)S.exams={};if(S.exam&&!S.exams[1])S.exams[1]=1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let AC=null;
function snd(f,d,t,v){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{snd(660,.1);setTimeout(()=>snd(990,.18),90)};
const bad=()=>snd(130,.3,'sawtooth',.06);
const tick=()=>snd(560,.05,'triangle',.05);
const zap=()=>{snd(90,.35,'sawtooth',.08);setTimeout(()=>snd(60,.3,'square',.06),80)};

function confetti(){const fx=$('#fx');const cols=['#FFC93C','#FF8A3D','#35C76F','#2F7FE0','#FF5A5A','#fff'];for(let i=0;i<46;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%6];d.style.animationDelay=Math.random()*.5+'s';d.style.animationDuration=1.2+Math.random()+'s';fx.appendChild(d);setTimeout(()=>d.remove(),2600)}}

const STAR='<path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z" stroke="#1B2A41" stroke-width="2" stroke-linejoin="round"/>';
const starRow=(n,lg)=>`<div class="stars${lg?' lg':''}">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24"><g fill="${i<n?'#FFC93C':'#E3E7EC'}">${STAR}</g></svg>`).join('')}</div>`;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="F" stroke="#1B2A41" stroke-width="2.2" stroke-linejoin="round"/></svg>';

const IC={
plug:`<svg viewBox="0 0 48 48"><rect x="9" y="4" width="30" height="40" rx="9" fill="#fff" stroke="${INK}" stroke-width="3"/><rect x="15" y="13" width="5" height="12" rx="1.5" fill="${INK}"/><rect x="28" y="14" width="4" height="10" rx="1.5" fill="${INK}"/><path d="M20.5 36v-3a3.5 3.5 0 0 1 7 0v3z" fill="${INK}"/></svg>`,
meter:`<svg viewBox="0 0 48 48"><rect x="8" y="3" width="32" height="42" rx="7" fill="#FFC93C" stroke="${INK}" stroke-width="3"/><rect x="13" y="8" width="22" height="12" rx="3" fill="#C8E6B0" stroke="${INK}" stroke-width="2.5"/><circle cx="24" cy="32" r="7" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M24 32l4-4" stroke="${INK}" stroke-width="3" stroke-linecap="round"/></svg>`,
grid:`<svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="8" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M4 24h40M24 4v40" stroke="${INK}" stroke-width="2.5"/><path d="M4 14h10v20h20V14" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14h10v20h20V14" fill="none" stroke="#FFC93C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
bolt:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#FF5A5A" stroke="${INK}" stroke-width="3"/><path d="M27 7L14 27h9l-3 14 14-21h-9z" fill="#FFC93C" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></svg>`,
clip:`<svg viewBox="0 0 48 48"><rect x="8" y="7" width="32" height="38" rx="5" fill="#C98A4B" stroke="${INK}" stroke-width="3"/><rect x="13" y="13" width="22" height="28" rx="2" fill="#fff" stroke="${INK}" stroke-width="2.5"/><rect x="17" y="3" width="14" height="8" rx="3" fill="#B4BCC6" stroke="${INK}" stroke-width="3"/><path d="M17 22l3 3 5-6M17 33h14" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
hat:`<svg viewBox="0 0 48 48"><path d="M6 34c0-11 8-20 18-20s18 9 18 20z" fill="#FFC93C" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M20 14.5V10h8v4.5" fill="#FFC93C" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><rect x="3" y="33" width="42" height="7" rx="3.5" fill="#FFC93C" stroke="${INK}" stroke-width="3"/><path d="M24 15v18" stroke="${INK}" stroke-width="2.5"/></svg>`,
sw:`<svg viewBox="0 0 48 48"><rect x="10" y="3" width="28" height="42" rx="7" fill="#fff" stroke="${INK}" stroke-width="3"/><rect x="18" y="11" width="12" height="26" rx="4" fill="#FFF8E7" stroke="${INK}" stroke-width="3"/><rect x="20" y="13" width="8" height="11" rx="2" fill="${INK}"/><circle cx="24" cy="7.5" r="1.6" fill="${INK}"/><circle cx="24" cy="40.5" r="1.6" fill="${INK}"/></svg>`,
chain:`<svg viewBox="0 0 48 48"><path d="M6 14h18v20h18" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 14h18v20h18" fill="none" stroke="#F4F1EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="6" width="16" height="16" rx="5" fill="#8EE59B" stroke="${INK}" stroke-width="3"/><rect x="16" y="20" width="16" height="16" rx="5" fill="#8EE59B" stroke="${INK}" stroke-width="3"/><rect x="29" y="26" width="16" height="16" rx="5" fill="#FF8A8A" stroke="${INK}" stroke-width="3"/></svg>`,
insp:`<svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="14" fill="#fff" stroke="${INK}" stroke-width="3.5"/><path d="M30 30l12 12" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M13 20l5 5 9-10" fill="none" stroke="#35C76F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
snd:`<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#FFC93C" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/></svg>`,
off:`<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#E3E7EC" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M16 9l5 6M21 9l-5 6" stroke="${INK}" stroke-width="2" stroke-linecap="round"/></svg>`
};
const RANK=['','1st year apprentice','2nd year apprentice','3rd year apprentice','4th year apprentice','Journeyman'];
const YMAX=2,ORD=['','1st','2nd','3rd','4th'];
const JOBS=[
 {id:'install',yr:1,kind:'Install job',title:'Swap a kitchen receptacle',pay:80,xp:40,icon:'plug',color:'#FFC93C'},
 {id:'service',yr:1,kind:'Service call',title:'"My bathroom outlets died!"',pay:120,xp:50,icon:'meter',color:'#7FD8FF'},
 {id:'layout',yr:1,kind:'Layout job',title:'Route the kitchen circuit',pay:100,xp:50,icon:'grid',color:'#8EE59B'},
 {id:'emerg',yr:1,kind:'Emergency call',title:'Party panel meltdown',pay:100,xp:50,icon:'bolt',color:'#FF9C9C'},
 {id:'install2',yr:2,kind:'Install job',title:'Wire a 3-way switch',pay:140,xp:60,icon:'sw',color:'#FFC93C'},
 {id:'service2',yr:2,kind:'Service call',title:'"Half my bedroom is dead!"',pay:160,xp:70,icon:'chain',color:'#7FD8FF'},
 {id:'layout2',yr:2,kind:'Layout job',title:'Bathroom remodel circuit',pay:140,xp:60,icon:'grid',color:'#8EE59B'},
 {id:'inspect2',yr:2,kind:'Inspection rush',title:'Safe or hazard?',pay:140,xp:60,icon:'insp',color:'#C9B6FF'}];
const J=id=>JOBS.find(j=>j.id===id);
let timers=[];
const stop=()=>{timers.forEach(clearInterval);timers=[]};

function hud(){return `<div class="hud card"><div class="rank">${IC.hat}<div><small>Rank</small><b>${RANK[S.year]}</b></div></div><div class="cash">$${S.cash}</div><button class="mute" id="mute" aria-label="Sound ${S.mute?'off':'on'}">${S.mute?IC.off:IC.snd}</button></div>`}
function bindHud(){const m=$('#mute');if(m)m.onclick=()=>{S.mute=!S.mute;save();m.innerHTML=S.mute?IC.off:IC.snd;tick()}}

function title(){
 let armed=false;
 app.innerHTML=`<div class="title"><svg class="logo" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="#FFF8E7" stroke="${INK}" stroke-width="5"/><path d="M68 12L32 66h24l-8 42 40-58H64z" fill="#FFC93C" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></svg><h1>Spark Up</h1><p>Wire it. Fix it. Pass the exam. Go from apprentice to journeyman.</p><button class="btn big" id="go">${S.xp?'Clock back in':'Clock in'}</button>${S.xp?'<button class="link" id="wipe">Start over</button>':''}</div>`;
 $('#go').onclick=()=>{tick();S.name?board():signup()};
 const w=$('#wipe');if(w)w.onclick=()=>{if(!armed){armed=true;w.textContent='Tap again to erase your progress';return}S={cash:0,xp:0,year:1,stars:{},exams:{},mute:S.mute,view:0,name:S.name,joinPosted:S.joinPosted,joinedSync:S.joinedSync};save();syncMe();title()};
}

function board(){
 stop();onHall=false;
 const yr=S.view=Math.max(1,Math.min(S.view||S.year,S.year,YMAX));
 const js=JOBS.filter(j=>j.yr===yr);
 const done=js.filter(j=>S.stars[j.id]>0).length,need=Math.max(0,3-done),passed=S.exams[yr];
 const exTxt=passed?(yr>=YMAX?`Passed! Year ${yr+1} jobs are coming in the next update. Replay jobs to collect every star.`:`Passed! Year ${yr+1} is unlocked.`):need?`Finish ${need} more job${need>1?'s':''} to unlock.`:`Unlocked. Pass it to make ${ORD[yr+1]} year.`;

/* ---------- WIRING BOARD (shared by install jobs) ---------- */
function wiring(W,T,st){
 const svg=$('#rc');
 const wp=k=>{const w=W[k],t=T[st.map[k]],side=t.x<180?-1:t.x>180?1:0;return `M${w.x} 334 C${w.x} 300 ${t.x+side*46} ${t.y+44} ${t.x} ${t.y}`};
 function draw(){
  let wg='',sg='',tg='';
  for(const k in W){const w=W[k];const d=st.map[k]?wp(k):`M${w.x} 334 L${w.x} 318`;
   wg+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${w.c}" stroke-width="7" stroke-linecap="round"/>`;
   if(!st.map[k])sg+=`<circle cx="${w.x}" cy="316" r="${st.sel===k?13:9}" fill="${w.c}" stroke="${INK}" stroke-width="3" ${st.sel===k?'class="pulse"':''}/>`;
   sg+=`<circle data-w="${k}" cx="${w.x}" cy="322" r="18" fill="transparent"/>`}
  for(const k in T){const t=T[k],left=t.x<=180;
   tg+=`<circle cx="${t.x}" cy="${t.y}" r="15" fill="${t.c}" stroke="${INK}" stroke-width="3.5"/><path d="M${t.x-8} ${t.y}h16" stroke="${t.dark?'#fff':INK}" stroke-width="3" stroke-linecap="round"/>${st.sel&&!st.done?`<circle cx="${t.x}" cy="${t.y}" r="22" fill="none" stroke="#FFC93C" stroke-width="4" class="pulse"/>`:''}<text x="${t.x+(left?-24:24)}" y="${t.y+5}" text-anchor="${left?'end':'start'}" font-size="14" font-weight="600" fill="${INK}">${t.n}</text><circle data-t="${k}" cx="${t.x}" cy="${t.y}" r="23" fill="transparent"/>`}
  $('#wg').innerHTML=wg;$('#tg').innerHTML=tg;$('#sg').innerHTML=sg;
  $('#chips').innerHTML=Object.keys(W).map(k=>`<button class="chip${st.sel===k?' sel':''}" data-w="${k}"><i style="background:${W[k].c}"></i>${W[k].n}${st.map[k]?' &rarr; '+T[st.map[k]].n:''}</button>`).join('');
  $('#flip').disabled=Object.keys(st.map).length<Object.keys(W).length||st.done;
 }
 function pickW(k){if(st.done)return;st.sel=st.sel===k?null:k;tick();draw()}
 function pickT(t){if(st.done)return;if(!st.sel){const k=Object.keys(st.map).find(x=>st.map[x]===t);if(k){st.sel=k;tick();draw()}return}
  const prev=st.map[st.sel],other=Object.keys(st.map).find(x=>st.map[x]===t&&x!==st.sel);
  if(other){if(prev)st.map[other]=prev;else delete st.map[other]}
  st.map[st.sel]=t;st.sel=null;tick();draw()}
 svg.addEventListener('click',e=>{const el=e.target.closest('[data-w],[data-t]');if(!el)return;el.dataset.w?pickW(el.dataset.w):pickT(el.dataset.t)});
 $('#chips').onclick=e=>{const b=e.target.closest('[data-w]');if(b)pickW(b.dataset.w)};
 return draw;
}
function sparksAt(x,y){$('#fxg').innerHTML=`<g class="pulse"><path d="M${x} ${y-34}l8 22 22-8-14 18 18 14-23 2 2 22-14-16-14 16 2-22-23-2 18-14-14-18 22 8z" fill="#FFC93C" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></g>`}
function badgeAt(txt,col){$('#fxg').innerHTML+=`<g><rect x="60" y="138" width="240" height="44" rx="14" fill="${col}" stroke="${INK}" stroke-width="3.5"/><text x="180" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="${INK}">${txt}</text></g>`}
const BOXBG=`<rect x="68" y="8" width="224" height="326" rx="20" fill="#A7B1BD" stroke="${INK}" stroke-width="4"/><rect x="82" y="22" width="196" height="298" rx="12" fill="#8592A1"/><rect x="140" y="16" width="80" height="308" rx="10" fill="#CDD3DA" stroke="${INK}" stroke-width="3"/><circle cx="180" cy="32" r="6" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
const FXG='<g id="wg"></g><g id="sg"></g><g id="tg"></g><g id="fxg"></g>';
const WIREUI=`<p class="hint">Tap a wire, then tap a screw.</p><div class="chips" id="chips"></div><div class="row"><button class="btn alt" id="hint">Hint</button><button class="btn go" id="flip" disabled>Flip breaker ON</button></div><div class="msg" id="msg"></div>`;

/* ---------- INSTALL (year 1) ---------- */
function install(){
 const j=J('install');

 const T={silver:{x:112,y:165,c:'#D5DAE1',n:'Silver'},brass:{x:248,y:165,c:'#E8B64C',n:'Brass'},green:{x:180,y:290,c:'#3DBE5B',n:'Green'}};
 const st={sel:null,map:{},done:false};let tries=0,hint=false;
 shell(j,'The kitchen receptacle is cracked. The breaker is OFF and locked out. Land each wire on the right screw, then flip the breaker back on.',
 `<div class="stage card"><svg id="rc" viewBox="0 0 360 380" aria-label="Receptacle with three terminal screws and a cable with three wires">${BOXBG}
 <rect x="122" y="52" width="116" height="228" rx="28" fill="#FFF8E7" stroke="${INK}" stroke-width="4"/>
 ${[78,172].map(y=>`<rect x="144" y="${y}" width="72" height="78" rx="24" fill="#fff" stroke="${INK}" stroke-width="3"/><rect x="157" y="${y+16}" width="8" height="25" rx="2" fill="${INK}"/><rect x="195" y="${y+18}" width="7" height="20" rx="2" fill="${INK}"/><path d="M174 ${y+66}v-5a6 6 0 0 1 12 0v5z" fill="${INK}"/>`).join('')}
 <rect x="102" y="334" width="156" height="34" rx="14" fill="#F4F1EA" stroke="${INK}" stroke-width="3"/>

 $('#flip').onclick=()=>{
  tries++;const b=st.map.black,w=st.map.white,g=st.map.bare,m=$('#msg');$('#fxg').innerHTML='';

   m.className='msg ok';m.textContent='Power on. The plug-in tester shows correct wiring.';
   setTimeout(()=>result(j,Math.max(1,(hint?2:3)-(tries-1)),'Black (hot) goes to the brass screw, white (neutral) to the silver screw, and bare or green (ground) to the green screw. Polarity matters: the wide slot is the neutral, so the threaded shell of a lamp socket stays safe instead of being live.'),1100);return}
  m.className='msg bad';
  if(b==='green'){zap();sparksAt(T.green.x,T.green.y);badgeAt('BREAKER TRIPPED','#FFC9C9');m.innerHTML='<b>Bang!</b> The hot wire is on the green screw. That screw bonds to the strap and the grounded metal box, so hot went straight to ground: a dead short. The breaker tripped. Fix it and try again.'}
  else if(g!=='green'){zap();sparksAt(T[g].x,T[g].y);badgeAt('Tester: WIRING FAULT','#FFC9C9');m.innerHTML='<b>Wiring fault.</b> The bare ground is on a screw that carries normal current. The ground should only carry current during a fault, so it can safely trip the breaker. Never use it as a hot or a neutral.'}
  else{bad();badgeAt('Tester: HOT/NEU REVERSED','#FFC9C9');m.innerHTML='<b>It works, but it\'s wrong.</b> Hot is on the silver screw, so the wide slot is now hot. A lamp plugged in here would have a live socket shell. That\'s reversed polarity: a shock hazard.'}
  m.innerHTML+=' The breaker is back OFF.';
 };
 draw();
}

 shell(j,'Hallway light, switched from both ends. Switch A at the other end is already wired. Wire switch B, flip the breaker, then test it from both switches.',
 `<div class="stage card"><svg id="rc" viewBox="0 0 360 380" aria-label="Three-way switch with a common screw, two traveler screws and a ground screw">${BOXBG}
 <rect x="122" y="52" width="116" height="228" rx="20" fill="#FFF8E7" stroke="${INK}" stroke-width="4"/>
 <rect x="162" y="118" width="36" height="92" rx="10" fill="#fff" stroke="${INK}" stroke-width="3.5"/><rect x="168" y="124" width="24" height="38" rx="6" fill="${INK}"/>
 <text x="180" y="248" font-size="13" font-weight="600" fill="${INK}" text-anchor="middle">3-WAY</text>
 <rect x="84" y="334" width="96" height="34" rx="14" fill="#F4F1EA" stroke="${INK}" stroke-width="3"/><text x="132" y="356" font-size="13" font-weight="600" fill="${INK}" text-anchor="middle">12/3 from A</text>
 <rect x="188" y="334" width="96" height="34" rx="14" fill="#F4F1EA" stroke="${INK}" stroke-width="3"/><text x="236" y="356" font-size="13" font-weight="600" fill="${INK}" text-anchor="middle">12/2 to light</text>${FXG}</svg></div>

 $('#hint').onclick=()=>{hint=true;tick();const m=$('#msg');m.className='msg ok';m.innerHTML='<b>Hint:</b> The two wires from switch A are travelers. They go on the brass screws. The dark common screw gets the wire going to the light.'};
 const lit=()=>{const X=st.map[a?'blk':'red'],Y=st.map.leg,tb=b?'t2':'t1';return(X==='com'&&Y===tb)||(Y==='com'&&X===tb)};
 function bulb(on){return `<svg viewBox="0 0 360 150" style="display:block;width:100%"><g ${on?'':'opacity="0"'}>${[0,45,90,135,180].map(d=>{const r=(d+180)*Math.PI/180;return `<path d="M${180+Math.cos(r)*52} ${62+Math.sin(r)*52}L${180+Math.cos(r)*70} ${62+Math.sin(r)*70}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`}).join('')}</g><circle cx="180" cy="62" r="38" fill="${on?'#FFE070':'#E3E7EC'}" stroke="${INK}" stroke-width="4"/><rect x="164" y="98" width="32" height="26" rx="5" fill="#B4BCC6" stroke="${INK}" stroke-width="3.5"/><text x="180" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="${INK}">${on?'Light ON':'Light OFF'}</text></svg>`}
 function test(){const on=lit();
  $('#tst').innerHTML=`<div class="stage card" style="background:#FFF8E7">${bulb(on)}<div class="row"><button class="btn alt" id="sa">Switch A: ${a?'up':'down'}</button><button class="btn alt" id="sb">Switch B: ${b?'up':'down'}</button></div><p class="hint" style="margin:10px 2px 2px">Combos tried: ${seen.size} of 4</p></div>`;
  $('#sa').onclick=()=>flip('a');$('#sb').onclick=()=>flip('b')}
 function flip(k){if(k==='a')a^=1;else b^=1;const on=lit(),m=$('#msg');tick();

  if(seen.size<4)return;
  const ok=st.map.leg==='com';
  if(ok){st.done=true;m.className='msg ok';m.textContent='Every flip of either switch changes the light. That\'s a working 3-way.';
   setTimeout(()=>result(j,Math.max(1,(hint?2:3)-(tries-1)),'A 3-way switch has no ON or OFF. It sends power down one of two travelers, and either switch can swap which traveler is live, so flipping either one always changes the light. The dark common screw is the pivot: at the first switch it gets the power coming in, and at the last switch it gets the wire going to the light.'),1300)}
  else{bad();$('#tst').innerHTML='';m.className='msg bad';m.innerHTML='<b>Not a working 3-way.</b> Some flips did nothing, so the light only works in certain combos. That means a traveler is on the common screw. The breaker is back OFF. Fix it and try again.';st.done=false;draw()}}
 $('#flip').onclick=()=>{
  tries++;const m=$('#msg');$('#fxg').innerHTML='';$('#tst').innerHTML='';

  st.done=true;draw();a=0;b=0;seen=new Set(['00']);lastOn=lit();m.className='msg ok';m.textContent='Breaker ON. Now flip the switches and try all 4 combos.';test();

 draw();

/* ---------- EMERGENCY ---------- */
function emerg(){
 const j=J('emerg');
 const AP=[['Space heater',1500],['Hair dryer',1500],['Microwave',1000],['Coffee maker',1000],['Toaster',900],['Vacuum',1200],['Blender',600],['TV',200],['Lamp',60],['Laptop',90],['Game console',150],['Fan',100],['Slow cooker',250],['Kettle',1200]];

 `<div class="qcard card"><p class="q" style="font-size:18px">Amps = watts &divide; 120 V. A 15 A circuit holds about 1,800 W. A 20 A circuit holds about 2,400 W. You have 45 seconds and 3 lives.</p></div><button class="btn big" id="st" style="width:100%">Start shift</button>`);

 function run(){
  const CI=[{n:'Kitchen',r:20},{n:'Living room',r:15},{n:'Bedroom',r:15},{n:'Garage',r:20}].map(c=>Object.assign(c,{L:[],fuse:0,trip:0}));

function puzzle(cfg){
 const j=J(cfg.id);const N=5,C=70;
 const rot=m=>((m<<1)|(m>>3))&15;
 const SOL=cfg.sol,[pr,pc]=cfg.panel.split(',').map(Number);
 const DEC=[3,10,5,6,12,9,7,11,14,5,3,10];
 const g=[];let par=0,moves=0,solved=false,di=0;
 for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++){const s=SOL[r+','+c];
  if(s&&s.f){g[r][c]={f:s.f,m:s.m};continue}
  let m=s?s.m:DEC[di++%DEC.length];const sol=m;
  if(s){let k;do{k=1+Math.floor(Math.random()*3);m=sol;for(let i=0;i<k;i++)m=rot(m)}while(m===sol);
   let need=0,x=m;while(x!==sol){x=rot(x);need++}par+=need}
  else{const k=Math.floor(Math.random()*4);for(let i=0;i<k;i++)m=rot(m)}
  g[r][c]={m}}}
 shell(j,cfg.order,`<div class="gamehud card"><span>Moves: <b id="mv">0</b></span><span>Par: ${par}</span></div>
 <div class="stage card"><svg id="lg" viewBox="0 0 ${N*C} ${N*C}" aria-label="Wire tile puzzle"></svg></div><div id="code"></div>`);
 const D=[[-1,0,1],[0,1,2],[1,0,4],[0,-1,8]],OPP={1:4,2:8,4:1,8:2};
 function powered(){const on=new Set([cfg.panel]),q=[[pr,pc]];while(q.length){const[r,c]=q.shift();const m=g[r][c].m;
  for(const[dr,dc,b]of D){if(!(m&b))continue;const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=N||nc>=N)continue;const k=nr+','+nc;if(on.has(k))continue;if(g[nr][nc].m&OPP[b]){on.add(k);q.push([nr,nc])}}}return on}
 function draw(){const on=powered();let h='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g[r][c],x=c*C,y=r*C,cx=x+C/2,cy=y+C/2,p=on.has(r+','+c);
   const bg=t.f?(t.f==='Panel'?'#A7B1BD':p?'#BFF0CF':'#FFD9D9'):'#FFF8E7';
   h+=`<g data-rc="${r},${c}"><rect x="${x+3}" y="${y+3}" width="${C-6}" height="${C-6}" rx="12" fill="${bg}" stroke="${INK}" stroke-width="3"/>`;
   let seg='';for(const[dr,dc,b]of D)if(t.m&b)seg+=`M${cx} ${cy}L${cx+dc*C/2} ${cy+dr*C/2}`;
   h+=`<path d="${seg}" stroke="${INK}" stroke-width="15" stroke-linecap="round"/><path d="${seg}" stroke="${p?'#FFC93C':'#9AA5B1'}" stroke-width="8" stroke-linecap="round"/>`;
   if(t.f)h+=`<rect x="${cx-27}" y="${cy-14}" width="54" height="28" rx="9" fill="#fff" stroke="${INK}" stroke-width="3"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">${t.f}</text>`;
   else if([7,11,13,14].includes(t.m))h+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${p?'#FFC93C':'#9AA5B1'}" stroke="${INK}" stroke-width="3"/>`;
   h+='</g>'}
  $('#lg').innerHTML=h;
  if(cfg.targets.every(k=>on.has(k))&&!solved){solved=true;good();askCode()}}
 $('#lg').addEventListener('click',e=>{if(solved)return;const el=e.target.closest('[data-rc]');if(!el)return;const[r,c]=el.dataset.rc.split(',').map(Number),t=g[r][c];if(t.f)return;t.m=rot(t.m);moves++;$('#mv').textContent=moves;tick();draw()});
 function askCode(){
  const ord=shuffle(cfg.opts.map((o,i)=>i));let wrong=0;
  $('#code').innerHTML=`<div class="qcard card"><h3>Power's flowing! One more call before you energize:</h3><p class="q">${cfg.q}</p></div><div class="opts" id="co">${ord.map(i=>`<button class="btn" data-i="${i}">${cfg.opts[i][0]}</button>`).join('')}</div><div class="msg" id="msg"></div>`;
  $('#code').scrollIntoView({behavior:'smooth',block:'start'});
  $('#co').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i,m=$('#msg');
   if(i===cfg.ok){b.classList.add('right');$('#co').onclick=null;
    let st=moves<=par+3?3:moves<=par+9?2:1;st=Math.max(1,st-wrong);
    setTimeout(()=>result(j,st,cfg.lesson,`<p style="margin:0 0 4px">Moves: ${moves} (par ${par})</p>`),700)}
   else{wrong=1;b.classList.add('wrong');b.disabled=true;bad();m.className='msg bad';m.textContent=cfg.opts[i][1]}}}
 draw();
}

 ['Power (watts) equals&hellip;',['Volts × amps','Volts ÷ amps','Amps ÷ ohms','Ohms × watts'],0,'P = V × I. For example, 120 V × 10 A = 1,200 W.'],
 ['Typical US house service is&hellip;',['120/240 V single-phase','208 V three-phase','480 V','12 V DC'],0,'Most homes get 120/240 V single-phase: 120 V from either hot to neutral, and 240 V between the two hots.'],
 ['To measure current with a regular multimeter, the meter goes&hellip;',['In series with the load','In parallel with the load','Across the breaker','Between hot and ground'],0,'Current has to flow through the meter, so it goes in series. Clamp meters let you skip opening the circuit.'],
 ['A "continuous load" runs for&hellip;',['3 hours or more','30 minutes','10 minutes','24 hours'],0,'The NEC defines a continuous load as one expected to run for 3 hours or more. Size it at 125%, which means loading the breaker to about 80%.'],
 ['The National Electrical Code is also known as&hellip;',['NFPA 70','OSHA 1910','UL 94','IEEE 802'],0,'The NEC is NFPA 70, published by the National Fire Protection Association and updated every 3 years.'],
 ['In a 3-wire cable (12/3), the red wire is usually&hellip;',['A second hot or traveler','The neutral','The ground','Unused'],0,'Red is usually another ungrounded (hot) conductor, like a traveler on 3-way switches or the second hot of a 240 V circuit.'],
 ['Kitchen countertop receptacles need at least&hellip;',['Two 20 A small-appliance circuits','One 15 A circuit','One 30 A circuit','Three 15 A circuits'],0,'The NEC requires at least two 20 A small-appliance branch circuits for kitchen countertop receptacles.']];
const MATCH1=[['Black wire','Hot conductor'],['White wire','Neutral'],['Bare copper','Equipment ground'],['GFCI','Protects people from shock'],['AFCI','Protects against arcing fires']];


const QB2=[
 ['How many travelers run between two 3-way switches?',['2','1','3','4'],0,'Two travelers. Each 3-way switch picks which one is live.'],
 ['To control one light from 3 places, you need&hellip;',['Two 3-way switches and one 4-way','Three 3-way switches','Three single-pole switches','One 3-way and two 4-ways'],0,'The 3-ways go at the ends and the 4-way goes in the middle. Add one more 4-way for each extra location.'],
 ['On a 3-way switch, the common terminal is usually&hellip;',['The dark (black) screw','A brass screw','The green screw','Unmarked'],0,'The common is the darker screw. The two lighter brass screws are the travelers.'],
 ['In box fill, each 12 AWG conductor counts as&hellip;',['2.25 cu in','2.00 cu in','2.50 cu in','3.00 cu in'],0,'12 AWG is 2.25 cubic inches per conductor, and 14 AWG is 2.00.'],
 ['In box fill, a receptacle or switch on its strap counts as&hellip;',['2 conductors','1 conductor','None','4 conductors'],0,'Each device yoke counts as 2 conductors, based on the largest wire connected to it.'],
 ['In box fill, all the equipment grounds together count as&hellip;',['1 conductor','1 each','None','2 each'],0,'All the equipment grounding conductors together count as just 1, based on the largest one.'],
 ['NM cable must be secured within how far of most boxes?',['12 in.','24 in.','36 in.','6 ft'],0,'NM cable must be secured within 12 in. of the box, and then at least every 4½ ft.'],
 ['NM cable runs must be supported at least every&hellip;',['4½ ft','10 ft','2 ft','8 ft'],0,'Secure NM cable at intervals of no more than 4½ ft.'],
 ['Two 10 Ω resistors in parallel equal&hellip;',['5 Ω','20 Ω','10 Ω','100 Ω'],0,'Equal resistors in parallel: divide one by how many there are. 10 ÷ 2 = 5 Ω. In series they would add up to 20 Ω.'],
 ['Two 10 Ω resistors in series equal&hellip;',['20 Ω','5 Ω','10 Ω','1 Ω'],0,'In series, resistances add: 10 + 10 = 20 Ω.'],
 ['Voltage drop gets worse when the wire run gets&hellip;',['Longer','Shorter','Thicker','Colder'],0,'A longer wire has more resistance, so more voltage is lost along the way. Bigger wire helps fix it.'],
 ['A 240 V water heater is fed from a&hellip;',['2-pole breaker','Single-pole breaker','GFCI receptacle','3-way switch'],0,'A 2-pole breaker grabs both hot legs, and 240 V is the voltage between them.'],
 ['How many watts can a 240 V, 20 A circuit deliver?',['4,800 W','2,400 W','1,200 W','9,600 W'],0,'Watts = volts × amps. 240 × 20 = 4,800 W.'],
 ['What\'s the most continuous load a 20 A breaker should carry?',['16 A','20 A','18 A','25 A'],0,'Continuous loads are limited to 80% of the breaker rating. 20 × 0.8 = 16 A.'],
 ['10 AWG copper building wire is normally protected at&hellip;',['30 A','20 A','40 A','15 A'],0,'14 AWG goes with 15 A, 12 AWG with 20 A, and 10 AWG with 30 A.'],
 ['Where are neutral and ground bonded together?',['Only at the service (main panel)','In every subpanel','At every receptacle','Nowhere'],0,'They\'re bonded only at the service. In a subpanel, neutrals and grounds stay on separate bars.'],
 ['What makes a breaker trip when a hot wire touches a metal box?',['The equipment ground back to the panel','The ground rod','The neutral at the light','The meter'],0,'Fault current races back to the panel on the equipment ground, so the breaker trips fast. A ground rod can\'t carry enough current to do that.'],
 ['A receptacle reads 120 V hot to neutral and 0 V hot to ground. Most likely&hellip;',['The ground is open (not connected)','It\'s wired perfectly','The neutral is open','It\'s on 240 V'],0,'If hot to ground reads 0 V while hot to neutral reads 120 V, the ground path is missing.'],
 ['Which home location needs GFCI protection for its receptacles?',['Garage','Bedroom','Hallway','Living room'],0,'Garages need GFCI protection, along with bathrooms, kitchens, outdoors, basements, laundry areas and more.'],
 ['Bonding means&hellip;',['Connecting metal parts so they stay at the same voltage and give fault current a path','Burying a ground rod','Taping a splice','Labeling a panel'],0,'Bonding ties metal parts together, so there\'s no shock voltage between them and there\'s a solid path for fault current.']];
const MATCH2=[['3-way switch','Controls a light from 2 places'],['4-way switch','Goes between two 3-ways'],['2-pole breaker','Feeds 240 V loads'],['Traveler','Wire between 3-way switches'],['Pigtail','Short jumper, one wire per screw']];
const QB={1:QB1,2:QB2},MATCH={1:MATCH1,2:MATCH2};
function exam(yr){
 const qs=shuffle(QB[yr]).slice(0,8).map(q=>{const ord=shuffle([0,1,2,3]);return{q:q[0],a:ord.map(i=>q[1][i]),c:ord.indexOf(q[2]),e:q[3]}});
 let qi=0,right=0,res=[];
 function showQ(){const q=qs[qi];let answered=false;
  app.innerHTML=`<div class="top"><button class="btn alt sm" id="back">&larr; Quit</button><span class="tag" style="--c:#FFC93C">Year ${yr} exam</span></div>
  <div class="dots">${qs.map((_,i)=>`<i class="${res[i]===1?'r':res[i]===0?'w':i===qi?'c':''}"></i>`).join('')}</div>
  <div class="qcard card"><h3>Question ${qi+1} of 8</h3><p class="q">${q.q}</p></div>
  <div class="opts" id="ao">${q.a.map((a,i)=>`<button class="btn" data-i="${i}">${a}</button>`).join('')}</div><div id="ex"></div>`;
  $('#back').onclick=()=>{tick();board()};
  $('#ao').onclick=e=>{const b=e.target.closest('[data-i]');if(!b||answered)return;answered=true;const i=+b.dataset.i,ok=i===q.c;
   res[qi]=ok?1:0;if(ok){right++;good()}else bad();
   $('#ao').querySelectorAll('button').forEach((x,k)=>{if(k===q.c)x.classList.add('right');else if(k===i)x.classList.add('wrong')});
   $('#ex').innerHTML=`<div class="expl"><b>${ok?'Right!':'Not quite.'}</b> ${q.e}</div><button class="btn" id="nx" style="width:100%;margin-top:12px">${qi<7?'Next question':'On to the match-up'}</button>`;
   $('#nx').onclick=()=>{tick();qi++;qi<8?showQ():match()};
   $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'})}}
 function match(){
  const L=shuffle(MATCH[yr].map((p,i)=>[p[0],i])),R=shuffle(MATCH[yr].map((p,i)=>[p[1],i]));let sl=null,mist=0,got=0;
  app.innerHTML=`<div class="top"><button class="btn alt sm" id="back">&larr; Quit</button><span class="tag" style="--c:#FFC93C">Year ${yr} exam</span></div>
  <div class="qcard card"><h3>Final round: match-up</h3><p class="q">Tap an item on the left, then its match on the right.</p></div>
  <div class="match"><div class="col" id="ml">${L.map(x=>`<button class="mb" data-i="${x[1]}">${x[0]}</button>`).join('')}</div><div class="col" id="mr">${R.map(x=>`<button class="mb" data-i="${x[1]}">${x[0]}</button>`).join('')}</div></div><p class="msg" id="msg">Mistakes: 0</p>`;
  $('#back').onclick=()=>{tick();board()};
  $('#ml').onclick=e=>{const b=e.target.closest('.mb');if(!b||b.classList.contains('done'))return;$('#ml').querySelectorAll('.mb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sl=b;tick()};
  $('#mr').onclick=e=>{const b=e.target.closest('.mb');if(!b||!sl||b.classList.contains('done'))return;
   if(b.dataset.i===sl.dataset.i){b.classList.add('done');sl.classList.remove('sel');sl.classList.add('done');sl=null;got++;good();if(got===5)setTimeout(finish,500)}
   else{mist++;bad();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#msg').textContent='Mistakes: '+mist}};
  function finish(){const mp=Math.max(0,5-mist),tot=right+mp,pass=tot>=10;
   if(pass&&!S.exams[yr]){S.exams[yr]=1;S.year=Math.max(S.year,yr+1);S.cash+=200*yr;if(yr<YMAX)S.view=yr+1;post(`${S.name} passed the Year ${yr} exam and made ${ORD[yr+1]} year!`)}save();syncMe();
   if(pass){good();confetti()}else bad();
   const o=document.createElement('div');o.className='modal';
   o.innerHTML=`<div class="res card"><h2>${pass?'You passed!':'Not yet'}</h2><div class="earn" style="color:${pass?'#1E8C4C':'#C0392B'}">${tot} / 13</div><p style="margin:0 0 10px">Quiz: ${right}/8 &middot; Match-up: ${mp}/5. You need 10 to pass.</p><div class="why"><b>${pass?'Promoted to '+ORD[yr+1]+' year apprentice':'Study up and try again'}</b><p>${pass?'Nice work. You earned a $'+200*yr+' bonus. '+(yr<YMAX?'Year '+(yr+1)+' jobs are unlocked on the job board.':'Year '+(yr+1)+' jobs are coming in the next update.'):'Replay the jobs, since their "Why it matters" notes cover a lot of what\'s on the exam. You get a new mix of questions each try.'}</p></div><button class="btn" id="tb" style="width:100%">Job board</button></div>`;
   document.body.appendChild(o);o.querySelector('#tb').onclick=()=>{o.remove();tick();board()}}
 }
 showQ();
}

/* ---------- UNION HALL (Firebase) ---------- */
const LOCAL='Spark Up Local 1';
const FBV='10.12.2';
const CFG={apiKey:"AIzaSyD7yXia334pZkVavBGu822shVQPKD9r4uM",authDomain:"spark-up-81558.firebaseapp.com",projectId:"spark-up-81558",storageBucket:"spark-up-81558.firebasestorage.app",messagingSenderId:"740705988313",appId:"1:740705988313:web:7b393f83b21281b36698c8"};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let fb=null,fbState='connecting',MEM=[],NEWS=[],onHall=false;
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+(+b||0),0);
async function initFB(){
 const to=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12000));
 try{
  const base=`https://www.gstatic.com/firebasejs/${FBV}/`;
  await Promise.race([to,(async()=>{
   const[A0,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
   const app=A0.initializeApp(CFG);const auth=A.getAuth(app);const cred=await A.signInAnonymously(auth);
   fb={db:F.getFirestore(app),uid:cred.user.uid,F};
  })()]);
  fbState='online';
  const F=fb.F;
  F.onSnapshot(F.query(F.collection(fb.db,'members'),F.limit(300)),snap=>{MEM=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(onHall)hall()},()=>{});
  F.onSnapshot(F.query(F.collection(fb.db,'news'),F.orderBy('at','desc'),F.limit(20)),snap=>{NEWS=snap.docs.map(d=>d.data());if(onHall)hall()},()=>{});
  syncMe();
  if(S.name&&!S.joinPosted){S.joinPosted=1;save();post(`${S.name} joined the hall. Welcome!`)}
 }catch(e){fb=null;fbState='offline';if(onHall)hall()}
}
function syncMe(){if(!fb||!S.name)return;const F=fb.F;
 const d={name:S.name,year:Math.min(5,S.year),stars:Math.min(200,totalStars()),updated:F.serverTimestamp()};
 if(!S.joinedSync)d.joined=F.serverTimestamp();
 F.setDoc(F.doc(fb.db,'members',fb.uid),d,{merge:true}).then(()=>{if(!S.joinedSync){S.joinedSync=1;save()}}).catch(()=>{})}
function post(text){if(!fb||!S.name)return;const F=fb.F;
 F.addDoc(F.collection(fb.db,'news'),{uid:fb.uid,name:S.name,text:String(text).slice(0,120),at:F.serverTimestamp()}).catch(()=>{})}
const ago=ts=>{if(!ts||!ts.toMillis)return 'just now';const s=(Date.now()-ts.toMillis())/1000;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const YC=['#E3E7EC','#FFC93C','#7FD8FF','#8EE59B','#C9B6FF','#FF9C9C'];
const initials=n=>esc(String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase());

function signup(edit){
 app.innerHTML=`<div class="title" style="padding-top:4vh">${IC.hat.replace('<svg','<svg style="width:110px;height:110px"')}
 <h1 style="font-size:44px">Union Hall</h1><p>${edit?'Change the name on your hall card.':'Sign in at '+LOCAL+' before you clock in. Just your name. Other members will see it on the roster.'}</p>
 <div class="card" style="padding:16px;text-align:left;max-width:360px;margin:0 auto"><label for="nm" style="font-weight:600">Your name</label>
 <input id="nm" maxlength="24" autocomplete="name" value="${esc(S.name||'')}" placeholder="First name and last initial" style="display:block;width:100%;margin:8px 0 6px;font:500 18px Fredoka,system-ui,sans-serif;padding:12px;border:3px solid ${INK};border-radius:12px;min-height:50px">
 <p id="ne" style="margin:0 0 10px;font-size:14px;color:#C0392B;min-height:20px"></p>
 <button class="btn" id="join" style="width:100%">${edit?'Save name':'Join the hall'}</button>
 ${edit?'<button class="link" id="cx">Cancel</button>':''}</div>
 <p class="fine">Tip: first name and last initial works great, like "Mike R."</p></div>`;
 const inp=$('#nm');inp.oninput=()=>{$('#ne').textContent=''};
 const go=()=>{const v=inp.value.replace(/\s+/g,' ').trim();
  if(v.length<2){$('#ne').textContent='Enter at least 2 letters.';return}
  if(!/^[A-Za-zÀ-ÿ' .\-]+$/.test(v)){$('#ne').textContent='Letters only, please. Spaces, periods, dashes and apostrophes are OK.';return}
  const first=!S.name;S.name=v;save();good();syncMe();
  if(first&&fb&&!S.joinPosted){S.joinPosted=1;save();post(`${v} joined the hall. Welcome!`)}
  edit?hall():board()};
 $('#join').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
 const cx=$('#cx');if(cx)cx.onclick=()=>{tick();hall()};
 if(!edit)setTimeout(()=>inp.focus(),50);
}

function nav(which){return `<div class="tabs" style="margin-bottom:10px"><button class="tab${which==='jobs'?' on':''}" id="nj">Job board</button><button class="tab${which==='hall'?' on':''}" id="nh">Union Hall</button></div>`}
function bindNav(){$('#nj').onclick=()=>{tick();board()};$('#nh').onclick=()=>{tick();hall()}}

function hall(){
 stop();onHall=true;
 const me=fb&&fb.uid;
 let mem=MEM.slice();
 if(!mem.find(m=>m.id===me)&&S.name)mem.push({id:me||'me',name:S.name,year:S.year,stars:totalStars()});
 mem.sort((a,b)=>(b.year||1)-(a.year||1)||(b.stars||0)-(a.stars||0)||String(a.name).localeCompare(String(b.name)));
 const status=fbState==='online'?'':fbState==='connecting'?'<div class="msg">Connecting to the hall&hellip;</div>':'<div class="msg bad">The hall is offline right now. You can keep playing; your card updates when you\'re back online.</div>';
 app.innerHTML=hud()+nav('hall')+`<h2 class="sec">${LOCAL}</h2>${status}
 <div class="card" style="padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;background:#FFF8E7"><span><b style="font-weight:600">${mem.length}</b> member${mem.length===1?'':'s'} on the roster</span><button class="btn alt sm" id="ed">Edit my name</button></div>
 <div class="roster">${mem.map((m,i)=>{const y=Math.max(1,Math.min(5,m.year||1)),mine=m.id===me||m.id==='me';
  return `<div class="mem card${mine?' me':''}"><span class="pos">${i+1}</span><span class="av" style="background:${YC[y]}">${initials(m.name)}</span><div class="mi"><b>${esc(m.name)}${mine?' <em>You</em>':''}</b><small>${RANK[y]}</small></div><span class="ms"><svg viewBox="0 0 24 24" style="width:22px;height:22px"><g fill="#FFC93C">${STAR}</g></svg>${+m.stars||0}</span></div>`}).join('')}</div>
 <h2 class="sec" style="font-size:22px;margin-top:18px">Hall news</h2>
 <div class="card news">${NEWS.length?NEWS.map(n=>`<div class="nw"><span>${esc(n.text)}</span><small>${ago(n.at)}</small></div>`).join(''):`<p style="margin:12px">${fbState==='online'?'No news yet. Go earn some stars!':'News shows up when the hall is online.'}</p>`}</div>`;
 bindHud();bindNav();$('#ed').onclick=()=>{tick();onHall=false;signup(true)};
}

const JOBF={install,service,layout,emerg,install2,service2,layout2,inspect2};
title();
initFB();
}
