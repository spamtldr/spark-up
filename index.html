<style>
/*
VOICE: a bright, chunky phone game for apprentice electricians; playful but the facts are exact.
IDEA: a job-site work order board: take jobs, earn pay, climb from apprentice to journeyman.
PICTURE: each job is a cartoon play surface (receptacle, floor plan, tile grid, live panel).
COLOUR and TYPE: sky blue ground, safety yellow, ink outlines with hard drop shadows; Fredoka.

*/
:root{--sky:#5EC8F2;--ink:#1B2A41;--yel:#FFC93C;--org:#FF8A3D;--grn:#35C76F;--red:#FF5A5A;--pap:#FFF8E7;--blu:#2F7FE0;color-scheme:light}

function wiring(W,T,st){
 const svg=$('#rc');
 const wp=k=>{const w=W[k],t=T[st.map[k]],side=t.x<180?-1:t.x>180?1:0;return `M${w.x} 334 C${w.x} 300 ${t.x+side*46} ${t.y+44} ${t.x} ${t.y}`};
 function draw(){
  let wg='',sg='',tg='';
  for(const k in W){const w=W[k];const d=st.map[k]?wp(k):`M${w.x} 334 L${w.x} 318`;
   wg+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${w.c}" stroke-width="7" stroke-linecap="round"/>${w.tape?`<path d="${d}" fill="none" stroke="${INK}" stroke-width="8" stroke-dasharray="10 12"/>`:''}`;
   if(!st.map[k])sg+=`<circle cx="${w.x}" cy="316" r="${st.sel===k?13:9}" fill="${w.c}" stroke="${INK}" stroke-width="3" ${st.sel===k?'class="pulse"':''}/>`;
   sg+=`<circle data-w="${k}" cx="${w.x}" cy="322" r="18" fill="transparent"/>`}
  for(const k in T){const t=T[k],left=t.x<=180;
   tg+=`<circle cx="${t.x}" cy="${t.y}" r="15" fill="${t.c}" stroke="${INK}" stroke-width="3.5"/><path d="M${t.x-8} ${t.y}h16" stroke="${t.dark?'#fff':INK}" stroke-width="3" stroke-linecap="round"/>${st.sel&&!st.done?`<circle cx="${t.x}" cy="${t.y}" r="22" fill="none" stroke="#FFC93C" stroke-width="4" class="pulse"/>`:''}<text x="${t.x+(left?-24:24)}" y="${t.y+5}" text-anchor="${left?'end':'start'}" font-size="14" font-weight="600" fill="${INK}">${t.n}</text><circle data-t="${k}" cx="${t.x}" cy="${t.y}" r="23" fill="transparent"/>`}
  $('#wg').innerHTML=wg;$('#tg').innerHTML=tg;$('#sg').innerHTML=sg;
  $('#chips').innerHTML=Object.keys(W).map(k=>`<button class="chip${st.sel===k?' sel':''}" data-w="${k}"><i style="background:${W[k].c}"></i>${W[k].n}${st.map[k]?' &rarr; '+(T[st.map[k]].f||T[st.map[k]].n):''}</button>`).join('');
  $('#flip').disabled=Object.keys(st.map).length<Object.keys(W).length||st.done;
 }
 function pickW(k){if(st.done)return;st.sel=st.sel===k?null:k;tick();draw()}
 function pickT(t){if(st.done)return;if(!st.sel){const k=Object.keys(st.map).find(x=>st.map[x]===t);if(k){st.sel=k;tick();draw()}return}
  const prev=st.map[st.sel],other=Object.keys(st.map).find(x=>st.map[x]===t&&x!==st.sel);
  if(other){if(prev)st.map[other]=prev;else delete st.map[other]}
  st.map[st.sel]=t;st.sel=null;tick();draw()}
 svg.addEventListener('click',e=>{const el=e.target.closest('[data-w],[data-t]');if(!el)return;el.dataset.w?pickW(el.dataset.w):pickT(el.dataset.t)});
 $('#chips').onclick=e=>{const b=e.target.closest('[data-w]');if(b)pickW(b.dataset.w)};
 const cl=$('#clr');if(cl)cl.onclick=()=>{if(st.done)return;for(const k in st.map)delete st.map[k];st.sel=null;$('#fxg').innerHTML='';const m=$('#msg');if(m){m.className='msg';m.textContent=''}tick();draw()};
 return draw;
}

/* ---------- EMERGENCY ---------- */
function emerg(){
 const j=J('emerg');
 const AP=[['Space heater',1500],['Hair dryer',1500],['Microwave',1000],['Coffee maker',1000],['Toaster',900],['Vacuum',1200],['Blender',600],['TV',200],['Lamp',60],['Laptop',90],['Game console',150],['Fan',100],['Slow cooker',250],['Kettle',1200]];
 shell(j,'Big party, old wiring. Circuits are overloading! When one flashes red, tap an appliance to move it to a circuit with room before the breaker trips.',
 `<div class="qcard card"><p class="q" style="font-size:18px">Amps = watts &divide; 120 V. A 15 A circuit holds about 1,800 W. A 20 A circuit holds about 2,400 W. You have 45 seconds and 3 lives.</p></div><button class="btn big" id="st" style="width:100%">Start shift</button>`);
 $('#st').onclick=()=>{tick();run()};
 function run(){
  const CI=[{n:'Kitchen',r:20},{n:'Living room',r:15},{n:'Bedroom',r:15},{n:'Garage',r:20}].map(c=>Object.assign(c,{L:[],fuse:0,trip:0}));
  let t=45,hearts=3,score=0,next=1,uid=0,over=false;
  app.querySelector('.qcard').remove();$('#st').remove();
  app.insertAdjacentHTML('beforeend',`<div class="gamehud card"><span id="tm">45s</span><span class="hearts" id="hh"></span><span id="sc">0</span></div><div id="pn"></div><div class="msg" id="msg"></div>`);
  const amps=c=>c.L.reduce((s,l)=>s+l[1],0)/120;
  function spawn(){const ok=CI.filter(c=>!c.trip&&c.L.length<5);if(!ok.length)return;const c=ok[Math.floor(Math.random()*ok.length)];
   const heavy=Math.random()<.55,pool=AP.filter(a=>heavy?a[1]>=900:a[1]<900);const a=pool[Math.floor(Math.random()*pool.length)];c.L.push([a[0],a[1],++uid])}
  function render(){
   $('#tm').textContent=Math.ceil(t)+'s';$('#sc').textContent=score+' pts';
   $('#hh').innerHTML=[0,1,2].map(i=>HEART.replace('F',i<hearts?'#FF5A5A':'#E3E7EC')).join('');
   $('#pn').innerHTML=CI.map((c,i)=>{const a=amps(c),pc=Math.min(100,a/c.r*100),ov=a>c.r;
    if(c.trip)return `<div class="circ card trip"><div class="ch">${c.n} <span>${c.r} A breaker</span></div><p style="margin:6px 0 0;font-weight:600">TRIPPED. Resetting&hellip;</p></div>`;
    return `<div class="circ card${ov?' over':''}"><div class="ch">${c.n} <span>${a.toFixed(1)} / ${c.r} A</span></div><div class="bar"><div style="width:${pc}%;background:${ov?'#FF5A5A':pc>80?'#FFC93C':'#35C76F'}"></div></div>${ov?`<div class="fuse" style="width:${100-c.fuse/3.5*100}%"></div>`:''}<div class="loads">${c.L.map(l=>`<button class="ld${l[1]>=900?' hot':''}" data-c="${i}" data-u="${l[2]}">${l[0]} ${(l[1]/120).toFixed(1)}A</button>`).join('')}</div></div>`}).join('')}
  $('#pn').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-u]');if(!b||over)return;e.preventDefault();
   const src=CI[+b.dataset.c],li=src.L.findIndex(l=>l[2]===+b.dataset.u);if(li<0)return;const l=src.L[li],need=l[1]/120,wasOver=amps(src)>src.r;
   let best=null,room=-1;CI.forEach(c=>{if(c===src||c.trip||c.L.length>=5)return;const r=c.r-amps(c);if(r>=need&&r>room){room=r;best=c}});
   src.L.splice(li,1);const m=$('#msg');
   if(best){best.L.push(l);tick();if(wasOver)score+=15;m.className='msg ok';m.textContent=`Moved the ${l[0].toLowerCase()} to the ${best.n.toLowerCase()} circuit.`}
   else{snd(300,.08,'triangle');m.className='msg';m.textContent=`No circuit had room, so the ${l[0].toLowerCase()} got unplugged.`}
   if(wasOver&&amps(src)<=src.r)src.fuse=0;render()});
  let acc=0;
  timers.push(setInterval(()=>{if(over)return;t-=.1;acc+=.1;next-=.1;
   if(next<=0){spawn();next=Math.max(.9,2.4-(45-t)*.035)}
   CI.forEach(c=>{if(c.trip){c.trip-=.1;if(c.trip<=0)c.trip=0;return}
    if(amps(c)>c.r){c.fuse+=.1;if(c.fuse>=3.5){c.trip=2;c.fuse=0;c.L=[];hearts--;zap();const m=$('#msg');m.className='msg bad';m.textContent=`The ${c.n.toLowerCase()} breaker tripped! The breaker did its job, but the party went dark.`}}
    else c.fuse=0});
   if(acc>=1){acc=0;score+=CI.filter(c=>!c.trip).length}
   render();
   if(hearts<=0||t<=0){over=true;stop();
    setTimeout(()=>result(j,Math.max(0,hearts),'Every appliance adds amps to its circuit. A 15 A breaker holds about 1,800 W at 120 V (15 &times; 120). Two heat-making appliances like a heater and a hair dryer will trip it. That\'s why kitchens get 20 A circuits and big loads often get their own circuit. A tripped breaker isn\'t the problem. It\'s protecting the wire from overheating. And if a load runs 3 hours or more, it\'s a continuous load: keep it to 80% of the breaker, like 12 A on a 15 A circuit.',`<p style="margin:0 0 4px">Score: ${score} &middot; Lives left: ${Math.max(0,hearts)}</p>`),500)}
  },100));
  spawn();spawn();render();
 }
}

/* ---------- LAYOUT PUZZLE (shared) ---------- */
function puzzle(cfg){
 const j=J(cfg.id);const N=5,C=70;
 const rot=m=>((m<<1)|(m>>3))&15;
 const mx=Math.random()<.5,my=Math.random()<.5;
 const tm=m=>{if(mx)m=(m&5)|(m&2?8:0)|(m&8?2:0);if(my)m=(m&10)|(m&1?4:0)|(m&4?1:0);return m};
 const tk=k=>{let[r,c]=k.split(',').map(Number);if(mx)c=4-c;if(my)r=4-r;return r+','+c};
 const SOL={};for(const k in cfg.sol){const s=cfg.sol[k];SOL[tk(k)]=Object.assign({},s,{m:tm(s.m)})}
 const PAN=tk(cfg.panel),TGT=cfg.targets.map(tk),[pr,pc]=PAN.split(',').map(Number);
 const DEC=[3,10,5,6,12,9,7,11,14,5,3,10];
 const g=[];let par=0,moves=0,solved=false,di=0;
 for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++){const s=SOL[r+','+c];
  if(s&&s.f){g[r][c]={f:s.f,m:s.m};continue}
  let m=s?s.m:DEC[di++%DEC.length];const sol=m;
  if(s){let k;do{k=1+Math.floor(Math.random()*3);m=sol;for(let i=0;i<k;i++)m=rot(m)}while(m===sol);
   let need=0,x=m;while(x!==sol){x=rot(x);need++}par+=need}
  else{const k=Math.floor(Math.random()*4);for(let i=0;i<k;i++)m=rot(m)}
  g[r][c]={m}}}
 shell(j,cfg.order,`<div class="gamehud card"><span>Moves: <b id="mv">0</b></span><span>Par: ${par}</span></div>
 <div class="stage card"><svg id="lg" viewBox="0 0 ${N*C} ${N*C}" aria-label="Wire tile puzzle"></svg></div><div id="code"></div>`);
 const D=[[-1,0,1],[0,1,2],[1,0,4],[0,-1,8]],OPP={1:4,2:8,4:1,8:2};
 function powered(){const on=new Set([PAN]),q=[[pr,pc]];while(q.length){const[r,c]=q.shift();const m=g[r][c].m;
  for(const[dr,dc,b]of D){if(!(m&b))continue;const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=N||nc>=N)continue;const k=nr+','+nc;if(on.has(k))continue;if(g[nr][nc].m&OPP[b]){on.add(k);q.push([nr,nc])}}}return on}
 function draw(){const on=powered();let h='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g[r][c],x=c*C,y=r*C,cx=x+C/2,cy=y+C/2,p=on.has(r+','+c);
   const bg=t.f?(t.f==='Panel'?'#A7B1BD':p?'#BFF0CF':'#FFD9D9'):'#FFF8E7';
   h+=`<g data-rc="${r},${c}"><rect x="${x+3}" y="${y+3}" width="${C-6}" height="${C-6}" rx="12" fill="${bg}" stroke="${INK}" stroke-width="3"/>`;
   let seg='';for(const[dr,dc,b]of D)if(t.m&b)seg+=`M${cx} ${cy}L${cx+dc*C/2} ${cy+dr*C/2}`;
   h+=`<path d="${seg}" stroke="${INK}" stroke-width="15" stroke-linecap="round"/><path d="${seg}" stroke="${p?'#FFC93C':'#9AA5B1'}" stroke-width="8" stroke-linecap="round"/>`;
   if(t.f)h+=`<rect x="${cx-27}" y="${cy-14}" width="54" height="28" rx="9" fill="#fff" stroke="${INK}" stroke-width="3"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">${t.f}</text>`;
   else if([7,11,13,14].includes(t.m))h+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${p?'#FFC93C':'#9AA5B1'}" stroke="${INK}" stroke-width="3"/>`;
   h+='</g>'}
  $('#lg').innerHTML=h;
  if(TGT.every(k=>on.has(k))&&!solved){solved=true;good();askCode()}}
 $('#lg').addEventListener('click',e=>{if(solved)return;const el=e.target.closest('[data-rc]');if(!el)return;const[r,c]=el.dataset.rc.split(',').map(Number),t=g[r][c];if(t.f)return;t.m=rot(t.m);moves++;$('#mv').textContent=moves;tick();draw()});
 function askCode(){
  const ord=shuffle(cfg.opts.map((o,i)=>i));let wrong=0;
  $('#code').innerHTML=`<div class="qcard card"><h3>Power's flowing! One more call before you energize:</h3><p class="q">${cfg.q}</p></div><div class="opts" id="co">${ord.map(i=>`<button class="btn" data-i="${i}">${cfg.opts[i][0]}</button>`).join('')}</div><div class="msg" id="msg"></div>`;
  $('#code').scrollIntoView({behavior:'smooth',block:'start'});
  $('#co').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i,m=$('#msg');
   if(i===cfg.ok){b.classList.add('right');$('#co').onclick=null;
    let st=moves<=par+3?3:moves<=par+9?2:1;st=Math.max(1,st-wrong);
    setTimeout(()=>result(j,st,cfg.lesson,`<p style="margin:0 0 4px">Moves: ${moves} (par ${par})</p>`),700)}
   else{wrong=1;b.classList.add('wrong');b.disabled=true;bad();m.className='msg bad';m.textContent=cfg.opts[i][1]}}}
 draw();
}

function roughin(){

 shell(j,`Rough-in inspection tomorrow. A ${L/12} ft run of NM cable goes between two boxes. Tap the cable to add staples (tap one again to remove it), then call the inspector.`,

  h+=`<rect x="4" y="48" width="22" height="44" rx="4" fill="#9FD8F5" stroke="${INK}" stroke-width="3"/><rect x="334" y="48" width="22" height="44" rx="4" fill="#9FD8F5" stroke="${INK}" stroke-width="3"/>`;
  st.forEach(p=>{h+=`<path d="M${X(p)-6} 60v14h12V60" fill="none" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M${X(p)-6} 60v14h12V60" fill="none" stroke="#B4BCC6" stroke-width="2" stroke-linejoin="round"/>`});

 $('#rw').addEventListener('click',e=>{const r=$('#rw').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*360;let p=Math.round(((x-20)/320*L)/6)*6;p=Math.max(3,Math.min(L-3,p));
  const near=st.findIndex(q=>Math.abs(q-p)<=6);if(near>=0)st.splice(near,1);else st.push(p);st.sort((a,b)=>a-b);bad1=null;tick();draw()});
 $('#insp').onclick=()=>{tries++;const m=$('#msg');const pts=[0,...st,L];let err=null;

  good();m.className='msg ok';m.innerHTML=`<b>Passed!</b> ${st.length} staples (the fewest that work here is ${need}).`;$('#insp').disabled=true;

/* ---------- YEAR 2: GARAGE SUBPANEL ---------- */

 const T={l1:{x:150,y:70,c:'#B4BCC6',n:'L1'},l2:{x:210,y:70,c:'#B4BCC6',n:'L2'},nb:{x:112,y:250,c:'#D5DAE1',n:'Neutral bar'},gb:{x:248,y:250,c:'#3DBE5B',n:'Ground bar'}};
 const st={sel:null,map:{},done:false};let tries=0,hint=false,bond=true;
 shell(j,'Attached garage subpanel, fed from the main panel with a 4-wire feeder: two hots, a neutral and a ground. Land the feeder, check the bonding screw, then energize.',
 `<div class="stage card"><svg id="rc" viewBox="0 0 360 380" aria-label="Subpanel with main lugs, a neutral bar and a ground bar">
 <rect x="68" y="8" width="224" height="326" rx="10" fill="#A7B1BD" stroke="${INK}" stroke-width="4"/><rect x="82" y="22" width="196" height="298" rx="6" fill="#8592A1"/>
 <rect x="160" y="96" width="14" height="130" rx="3" fill="#E8B64C" stroke="${INK}" stroke-width="3"/><rect x="186" y="96" width="14" height="130" rx="3" fill="#E8B64C" stroke="${INK}" stroke-width="3"/>
 <rect x="90" y="236" width="70" height="18" rx="4" fill="#D5DAE1" stroke="${INK}" stroke-width="3"/><rect x="200" y="236" width="70" height="18" rx="4" fill="#9BE3AE" stroke="${INK}" stroke-width="3"/>
 <g id="bond"></g>
 <rect x="102" y="334" width="156" height="34" rx="14" fill="#F4F1EA" stroke="${INK}" stroke-width="3"/><text x="180" y="356" font-size="13" font-weight="600" fill="${INK}" text-anchor="middle">4-wire feeder from main</text>${FXG}</svg></div>
 <button class="btn alt" id="bt" style="width:100%;margin-bottom:12px"></button>${WIREUI}`);
 const draw=wiring(W,T,st);
 function db(){$('#bond').innerHTML=bond?`<circle cx="125" cy="275" r="10" fill="#3DBE5B" stroke="${INK}" stroke-width="3"/><path d="M119 275h12" stroke="${INK}" stroke-width="2.5"/><text x="140" y="280" font-size="13" font-weight="700" fill="#fff">bond screw</text>`:'';$('#bt').textContent=bond?'Bonding screw: INSTALLED (tap to remove)':'Bonding screw: REMOVED (tap to install)'}

 $('#hint').onclick=()=>{hint=true;tick();const m=$('#msg');m.className='msg ok';m.innerHTML='<b>Hint:</b> Hots on the lugs, neutral on the neutral bar, ground on the ground bar. In a subpanel, neutral and ground stay separate.'};

  const hotBad=['blk','red'].find(k=>mp[k]==='nb'||mp[k]==='gb');

  if(mp.wht!=='nb'||mp.bare!=='gb'){bad();badgeAt('INSPECTOR: FAIL','#FFC9C9');m.innerHTML='<b>Neutral and ground are swapped.</b> Normal current would ride the ground wire, and the ground can\'t do its job in a fault. White goes on the neutral bar, bare on the ground bar.';return}

/* ---------- Y3: CONDUIT BENDER (offset) ---------- */
function bend(){
 const j=J('bend'),H=[4,6,8,10][Math.floor(Math.random()*4)];
 const ANG={10:[6,1/16],22.5:[2.6,3/16],30:[2,1/4],45:[1.4,3/8]};let ang=null,dist=10,miss=0,stage=0;
 shell(j,`${H===8?'An':'A'} ${H} in. tall beam is in the way of your EMT run. Bend an offset to clear it: pick an angle, set the distance between your marks, then bend.`,
 `<div class="stage card"><svg id="bv" viewBox="0 0 360 170" style="display:block;width:100%"></svg></div><div id="bc"></div><div class="msg" id="msg"></div>`);
 function draw(bent,ok){const y0=130,y1=130-H*8,a=ang?ANG[ang]:null;let h=`<rect x="0" y="140" width="360" height="30" fill="#E3BF7E"/><rect x="190" y="${y0-H*8+4}" width="60" height="${H*8-4+10}" fill="#B4BCC6" stroke="${INK}" stroke-width="3"/><text x="220" y="${y0+24}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">${H} in. beam</text>`;
  if(!bent)h+=`<path d="M10 ${y0}H350" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M10 ${y0}H350" stroke="#D5DAE1" stroke-width="5" stroke-linecap="round"/>${ang?`<path d="M120 ${y0-12}v24M${120+dist*4} ${y0-12}v24" stroke="#FF5A5A" stroke-width="3"/><text x="${120+dist*2}" y="${y0-18}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">${dist} in.</text>`:''}`;
  else{const rise=ok?H*8+6:Math.max(10,Math.min(H*8+30,(dist/a[0])*8+6)),run=dist*4*Math.cos(ang*Math.PI/180);const yT=y0-rise;
   h+=`<path d="M10 ${y0}H120L${120+run} ${yT}H350" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 ${y0}H120L${120+run} ${yT}H350" fill="none" stroke="${ok?'#9BE3AE':'#FFC9C9'}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}
  $('#bv').innerHTML=h}
 function pickAngle(){$('#bc').innerHTML=`<h2 class="sec" style="font-size:19px">1. Pick your bend angle</h2><div class="chips">${Object.keys(ANG).map(a=>`<button class="chip ag" data-a="${a}">${a}°</button>`).join('')}</div><p class="hint">Each angle has a multiplier: distance between marks = offset height × multiplier.</p>`;
  app.querySelectorAll('.ag').forEach(b=>b.onclick=()=>{ang=+b.dataset.a;tick();setDist()})}
 function setDist(){draw();$('#bc').innerHTML=`<h2 class="sec" style="font-size:19px">2. Distance between marks: <span id="dv">${dist}</span> in.</h2><p class="hint">${ang}° multiplier = ${ANG[ang][0]}. Your offset is ${H} in.</p><div class="row"><button class="btn alt" data-d="-1">−1</button><button class="btn alt" data-d="-0.5">−½</button><button class="btn alt" data-d="0.5">+½</button><button class="btn alt" data-d="1">+1</button></div><div class="row" style="margin-top:10px"><button class="btn alt" id="ba">Change angle</button><button class="btn go" id="bn">Bend it</button></div>`;
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dist=Math.max(2,Math.min(70,dist+ +b.dataset.d));$('#dv').textContent=dist;tick();draw()});
  $('#ba').onclick=()=>{tick();pickAngle()};
  $('#bn').onclick=()=>{const need=H*ANG[ang][0],ok=Math.abs(dist-need)<=.5;snd(180,.2,'sawtooth',.04);draw(true,ok);
   if(ok){good();msgEl(`Clean offset. ${H} in. × ${ANG[ang][0]} = ${fmt1(need)} in. between marks.`,'ok');setTimeout(shrink,1500)}
   else{miss++;bad();msgEl(`${dist<need?'Not enough rise. The pipe hits the beam.':'Too much rise. The pipe overshoots.'} Distance between marks = ${H} × ${ANG[ang][0]}.`,'bad');setTimeout(()=>draw(),1600)}}}
 function shrink(){const s=H*ANG[ang][1],opts=shuffle([30+s,30,30-s,30+2*s]);
  $('#bc').innerHTML=`<h2 class="sec" style="font-size:19px">3. Account for shrink</h2><div class="qcard card"><p class="q" style="font-size:17px">The beam starts 30 in. from the end of your pipe. Offsets shrink the pipe by ${frac(ANG[ang][1])} per inch of rise at ${ang}°. Where does your first mark go?</p></div><div class="chips">${opts.map(o=>`<button class="chip sh" data-v="${o}">${frac(o)}</button>`).join('')}</div>`;
  app.querySelectorAll('.sh').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(Math.abs(v-(30+s))<.01){good();msgEl(`Right. ${H} in. × ${frac(ANG[ang][1])} = ${frac(s)} of shrink, so mark at ${frac(30+s)} Working toward the obstacle, you add the shrink.`,'ok');
    setTimeout(()=>result(j,miss===0?3:miss<=2?2:1,'Offset math: distance between marks = offset height × the angle\'s multiplier (10° = 6, 22.5° = 2.6, 30° = 2, 45° = 1.4). Offsets also shrink the pipe: 30° bends lose 1/4 in. per inch of rise, 45° lose 3/8 in. Add the shrink to your measurement when you\'re working toward the obstacle.'),1600)}

/* ---------- Y3: PULL THE WIRE (conduit fill) ---------- */
function pull(){
 const j=J('pull');const SET=[[6,12],[9,12],[10,12],[4,8],[6,10],[12,10],[4,6]][Math.floor(Math.random()*7)];
 const AREA={14:.0097,12:.0133,10:.0211,8:.0366,6:.0507},EMT=[['½ in.',.122],['¾ in.',.213],['1 in.',.346],['1¼ in.',.598]];
 const tot=SET[0]*AREA[SET[1]],best=EMT.findIndex(e=>e[1]>=tot);let fails=0;
 shell(j,`Pull ${SET[0]} THHN ${SET[1]} AWG conductors through an EMT run. Pick the conduit size. Overstuff it and the pull jams.`,
 `<div class="qcard card"><h3>Fill limit for 3+ conductors: 40%</h3><p class="q" style="font-size:17px">Each ${SET[1]} AWG THHN is ${AREA[SET[1]]} sq in. Total: ${SET[0]} × ${AREA[SET[1]]} = <b>${tot.toFixed(4)} sq in</b>.</p></div>
 <div class="shop">${EMT.map((e,i)=>`<button class="si card emt" data-i="${i}"><svg viewBox="0 0 60 60" style="width:60px;height:60px"><circle cx="30" cy="30" r="${10+i*6}" fill="#D5DAE1" stroke="${INK}" stroke-width="3"/><circle cx="30" cy="30" r="${7+i*6}" fill="#fff" stroke="${INK}" stroke-width="2"/></svg><b>${e[0]} EMT</b><span class="pay">40% = ${e[1]} sq in</span></button>`).join('')}</div>
 <div class="stage card" id="pv" style="display:none"></div><div class="msg" id="msg"></div>`);
 app.querySelectorAll('.emt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,e=EMT[i],pct=tot/(e[1]/.4)*100,ok=tot<=e[1];
  $('#pv').style.display='block';$('#pv').innerHTML=`<p style="margin:0 0 6px;font-weight:600">${e[0]} EMT fill: ${fmt1(pct)}%</p><div class="bar"><div style="width:${Math.min(100,pct/40*100)}%;background:${ok?'#35C76F':'#FF5A5A'}"></div></div><p style="margin:4px 0 0;font-size:14px">Limit: 40%</p>`;
  if(!ok){fails++;bad();b.classList.add('wrong');msgEl(`<b>Jammed!</b> ${fmt1(pct)}% fill. The wires bind, and you burn the insulation pulling. Go bigger.`,'bad');return}
  good();msgEl(`<b>Smooth pull.</b> ${fmt1(pct)}% fill.${i===best?' Smallest conduit that works.':' It fits, but a smaller size would have too.'}`,'ok');app.querySelectorAll('.emt').forEach(x=>x.disabled=true);
  setTimeout(()=>result(j,fails===0&&i===best?3:fails<=1?2:1,'With three or more conductors, conduit fill is limited to 40% of the conduit\'s inside area. Add up each wire\'s area from the THHN table, then pick a conduit whose 40% area is at least that big. Overfilling makes pulls brutal and damages insulation.'),1500)});
}

/* ---------- Y3: 3-PHASE MOTOR ---------- */
function motor(){
 const j=J('motor'),FLA=[8,12,14,20,28][Math.floor(Math.random()*5)];let L=shuffle(['L1','L2','L3']),swaps=0,miss=0,need=Math.random()<.5?'cw':'ccw';

/* ---------- Y3: BALANCE THE PANEL ---------- */
function balance(){
 const j=J('balance');const LD=shuffle([['Lights',12],['Copier',10],['Break room',16],['Server',8],['Heater',14],['Signs',6],['Fans',9],['Receptacles',13],['Vending',7]]);
 const ph={A:[],B:[],C:[]};let sel=null,tries=0;
 shell(j,'New 208Y/120 V panel in an office. Tap a load, then tap phase A, B or C. Balance them so the neutral barely carries anything. Tap a placed load to take it back off.',
 `<div class="gamehud card"><span>Neutral: <b id="nI">0.0</b> A</span><span>Spread: <b id="sp">0</b> A</span></div><div class="phs" id="phs"></div><h2 class="sec" style="font-size:18px">Unassigned loads (tap one)</h2><div class="chips" id="pool"></div><button class="btn go" id="done" style="width:100%" disabled>Energize the panel</button><div class="msg" id="msg"></div>`);
 const sum=k=>ph[k].reduce((a,l)=>a+l[1],0);
 const neut=()=>{const a=sum('A'),b=sum('B'),c=sum('C');return Math.sqrt(Math.max(0,a*a+b*b+c*c-a*b-b*c-c*a))};
 function draw(){const pool=LD.filter(l=>!['A','B','C'].some(k=>ph[k].includes(l)));
  $('#phs').innerHTML=['A','B','C'].map(k=>`<button class="ph card" data-k="${k}"><b>Phase ${k}</b><span class="amp">${sum(k)} A</span>${ph[k].map(l=>`<span class="ld2" data-n="${l[0]}">${l[0]} ${l[1]}A</span>`).join('')}</button>`).join('');
  $('#pool').innerHTML=pool.map(l=>`<button class="chip pl${sel===l?' sel':''}" data-n="${l[0]}">${l[0]} ${l[1]} A</button>`).join('')||'<p style="margin:0">All loads placed.</p>';
  const s=['A','B','C'].map(sum);$('#nI').textContent=fmt1(neut());$('#sp').textContent=Math.max(...s)-Math.min(...s);$('#done').disabled=!!pool.length;

  app.querySelectorAll('.ph').forEach(b=>b.onclick=e=>{const t=e.target.closest('.ld2');if(t&&!sel){const k=b.dataset.k;ph[k]=ph[k].filter(l=>l[0]!==t.dataset.n);tick();draw();return}if(!sel)return;ph[b.dataset.k].push(sel);sel=null;tick();draw()})}

}

/* ---------- Y3: STORM NIGHT (arcade) ---------- */
function storm(){

 const CK=shuffle([['Sump pump',8,30,1],['Fridge',6,24,1],['Furnace blower',7,20,0],['AC unit',22,70,0],['Water heater',19,19,0],['Lights',5,5,0],['Garage freezer',5,22,1]]);

 $('#go2').onclick=()=>{tick();run()};
 function run(){
  const MAIN=100;let on={},surge={},strikes=0,t=45,over=false,order=[];
  $('#go2').remove();app.insertAdjacentHTML('beforeend',`<div class="gamehud card"><span id="tm">45s</span><span class="hearts" id="hh"></span><span>Main: <b id="ml">0</b>/${MAIN} A</span></div><div class="bar" style="height:22px"><div id="mb"></div></div><div class="opts" id="ck" style="margin-top:12px"></div><div class="msg" id="msg"></div>`);
  const load=()=>CK.reduce((a,c)=>a+(on[c[0]]?(surge[c[0]]>0?c[2]:c[1]):0),0);
  function draw(){const l=load();$('#ml').textContent=l;$('#mb').style.width=Math.min(100,l/MAIN*100)+'%';$('#mb').style.background=l>MAIN?'#FF5A5A':l>80?'#FFC93C':'#35C76F';$('#tm').textContent=Math.ceil(t)+'s';$('#hh').innerHTML=[0,1,2].map(k=>HEART.replace('F',k<3-strikes?'#FF5A5A':'#E3E7EC')).join('');
   $('#ck').innerHTML=CK.map(c=>`<button class="btn ${on[c[0]]?'go':'alt'}" data-n="${c[0]}" ${on[c[0]]?'disabled':''}>${c[3]?'★ ':''}${c[0]} &middot; ${c[1]} A${c[2]>c[1]?` (starts at ${c[2]} A)`:''}</button>`).join('')}
  $('#ck').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b||over)return;const n=b.dataset.n;on[n]=1;surge[n]=3;order.push(n);tick();draw()});
  timers.push(setInterval(()=>{if(over)return;t-=.1;for(const k in surge)if(surge[k]>0)surge[k]-=.1;
   if(load()>MAIN){strikes++;zap();on={};surge={};order=[];msgEl('<b>Main tripped!</b> Too many motors starting at once. Everything\'s off. Stagger the starts.','bad')}
   draw();
   if(CK.every(c=>on[c[0]])&&!Object.values(surge).some(s=>s>0)){finish(true)}else if(strikes>=3||t<=0)finish(false)},100));
  function finish(ok){if(over)return;over=true;stop();const crit=CK.filter(c=>c[3]).map(c=>c[0]),critFirst=ok&&order.slice(0,crit.length).every(n=>crit.includes(n));
   const st=!ok?0:strikes===0&&critFirst?3:strikes<=1?2:1;
   setTimeout(()=>result(j,st,'After an outage, everything trying to start at once is called cold load pickup. Motors (pumps, compressors, AC) draw several times their running current for a few seconds when they start. Bring loads back one at a time, critical ones first (sump pump, fridge and freezer), and let each motor settle before the next.',`<p style="margin:0 0 4px">${ok?(critFirst?'Critical loads first. Nice.':'All back on, but get the ★ critical loads up first next time.'):'Didn\'t get everything back on.'}</p>`),600)}
  draw()}
}

function exam(yr){
 const EN=yr===5?'Journeyman exam':`Year ${yr} exam`;
 const pool=[].concat(...Object.values(QB)).filter(q=>{const s=J(q[4]);return s&&(yr===5?s.yr>=1&&s.yr<=5:s.yr===yr)});
 const N=Math.min(yr===5?15:8,pool.length),TOT=N+5,PASS=Math.ceil(TOT*.75);
 const qs=shuffle(pool).slice(0,N).map(q=>{const ord=shuffle([0,1,2,3]);return{q:q[0],a:ord.map(i=>q[1][i]),c:ord.indexOf(q[2]),e:q[3],src:q[4]}});
 let qi=0,right=0,res=[];
 const top=`<div class="top"><button class="btn alt sm" id="back">&larr; Quit</button><span class="tag" style="--c:#FFC93C">${EN}</span></div>`;
 function showQ(){const q=qs[qi];let answered=false;
  app.innerHTML=top+`<div class="dots">${qs.map((_,i)=>`<i class="${res[i]===1?'r':res[i]===0?'w':i===qi?'c':''}"></i>`).join('')}</div>
  <div class="qcard card"><h3>Question ${qi+1} of ${N}</h3><p class="q">${q.q}</p></div>
  <div class="opts" id="ao">${q.a.map((a,i)=>`<button class="btn" data-i="${i}">${a}</button>`).join('')}</div><div id="ex"></div>`;
  $('#back').onclick=()=>{tick();board()};
  $('#ao').onclick=e=>{const b=e.target.closest('[data-i]');if(!b||answered)return;answered=true;const i=+b.dataset.i,ok=i===q.c;
   res[qi]=ok?1:0;if(ok){right++;good()}else bad();
   $('#ao').querySelectorAll('button').forEach((x,k)=>{if(k===q.c)x.classList.add('right');else if(k===i)x.classList.add('wrong')});
   $('#ex').innerHTML=`<div class="expl"><b>${ok?'Right!':'Not quite.'}</b> ${q.e}${ok?'':`<br><small style="font-weight:600">Review this job: ${J(q.src).title}</small>`}</div><button class="btn" id="nx" style="width:100%;margin-top:12px">${qi<N-1?'Next question':'On to the match-up'}</button>`;
   $('#nx').onclick=()=>{tick();qi++;qi<N?showQ():match()};
   $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'})}}
 function match(){
  const L=shuffle(MATCH[yr].map((p,i)=>[p[0],i])),R=shuffle(MATCH[yr].map((p,i)=>[p[1],i]));let sl=null,mist=0,got=0;
  app.innerHTML=top+`<div class="qcard card"><h3>Final round: match-up</h3><p class="q">Tap an item on the left, then its match on the right.</p></div>
  <div class="match"><div class="col" id="ml">${L.map(x=>`<button class="mb" data-i="${x[1]}">${x[0]}</button>`).join('')}</div><div class="col" id="mr">${R.map(x=>`<button class="mb" data-i="${x[1]}">${x[0]}</button>`).join('')}</div></div><p class="msg" id="msg">Mistakes: 0</p>`;
  $('#back').onclick=()=>{tick();board()};
  $('#ml').onclick=e=>{const b=e.target.closest('.mb');if(!b||b.classList.contains('done'))return;$('#ml').querySelectorAll('.mb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sl=b;tick()};
  $('#mr').onclick=e=>{const b=e.target.closest('.mb');if(!b||!sl||b.classList.contains('done'))return;
   if(b.dataset.i===sl.dataset.i){b.classList.add('done');sl.classList.remove('sel');sl.classList.add('done');sl=null;got++;good();if(got===5)setTimeout(finish,500)}
   else{mist++;bad();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#msg').textContent='Mistakes: '+mist}};
  function finish(){const mp=Math.max(0,5-mist),tot=right+mp,pass=tot>=PASS;let bonusTxt='';
   if(pass&&!S.exams[yr]){S.exams[yr]=1;S.year=Math.max(S.year,yr+1);const bn=200*yr;S.cash+=bn;S.earned=(S.earned||0)+bn;bonusTxt=`You earned a ${money(bn)} bonus. `;if(yr<YMAX)S.view=yr+1;post(`${S.name} passed the Year ${yr} exam and is now a ${RANK[yr+1]}!`)}
   save();syncMe();
   if(pass){good();confetti()}else{bad();post(`${S.name} failed the Year ${yr} exam (${tot}/${TOT}). Back to the books!`)}
   const o=document.createElement('div');o.className='modal';
   o.innerHTML=`<div class="res card"><h2>${pass?'You passed!':'Not yet'}</h2><div class="earn" style="color:${pass?'#1E8C4C':'#C0392B'}">${tot} / ${TOT}</div><p style="margin:0 0 10px">Quiz: ${right}/${N} &middot; Match-up: ${mp}/5. You need ${PASS} to pass.</p><div class="why"><b>${pass?'Promoted to '+RANK[yr+1]:'Study up and try again'}</b><p>${pass?bonusTxt+(yr<YMAX?`Year ${yr+1} jobs are unlocked on the job board.`:yr===5?'Welcome to the trade, Journeyman. The data center job is coming in the next update.':`Year ${yr+1} jobs are coming in the next update.`):'Every question comes from a job you\'ve done. Replay the ones it pointed you to, then try again. You get a new mix of questions each time.'}</p></div><button class="btn" id="tb" style="width:100%">Job board</button></div>`;
   document.body.appendChild(o);o.querySelector('#tb').onclick=()=>{o.remove();tick();board()}}
 }
 showQ();
}

  h+=`<div class="hl k-${it.k}"><span class="hi">${it.ic}</span><div class="hb"><p>${line}</p>${w.length>1?`<small class="hw">${w.map(esc).join(' · ')}</small>`:''}<div class="hm"><small>${ago(it.at)}</small>${chips}${open?`<span class="rpk">${Object.keys(EMO).map(e=>`<button class="rp" data-p="${id}" data-e="${e}" aria-label="React ${e}">${EMO[e]}</button>`).join('')}</span>`:`<button class="radd" data-o="${id}" aria-label="Add a reaction">☺+</button>`}</div></div></div>`}

function dcsite(){
 const j=J('dcsite'),CW=12,RH=9,C=28,OX=12,OY=12;

 const POLE=Math.random()<.5?{x:0,y:0,w:1,h:1}:{x:0,y:8,w:1,h:1};
 const PC={xf:{n:'Transformer',w:2,h:2},g1:{n:'Engine 1',w:2,h:1},g2:{n:'Engine 2',w:2,h:1},tk:{n:'Gas meter',w:1,h:1}};
 const pos={};let sel='xf',miss=0,bads=[];
 const gap=(a,b)=>{const dx=Math.max(0,b.x-(a.x+a.w),a.x-(b.x+b.w)),dy=Math.max(0,b.y-(a.y+a.h),a.y-(b.y+b.h));return {dx,dy,d:Math.max(dx,dy),e:Math.hypot(dx,dy)}};

 shell(j,'This AI campus makes its own power: gas engines run the building full time, and the utility is the backup. Lay out the yard. One square = 5 ft. Follow the engineer\'s spec, then call the inspector. The dashed gold line on the left is the gas main.',
 dcMini(0)+`<div class="qcard card" style="padding:12px 14px"><h3 style="margin-bottom:4px">Engineer's spec</h3><ul style="margin:0;padding-left:20px;font-size:15.5px;line-height:1.5">
 <li>Transformer: <b>10 ft+</b> from the building (oil fire risk), within <b>15 ft</b> of the utility pole</li>

 <div id="pcs" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px"></div>

  return `<rect x="${x+3}" y="${y+3}" width="${w-6}" height="${h-6}" rx="5" fill="#FFC93C" stroke="${s}" stroke-width="${sw}"/><circle cx="${x+w-12}" cy="${y+h/2}" r="5" fill="#5A6270" stroke="${INK}" stroke-width="2"/><text x="${x+18}" y="${y+h/2+4}" text-anchor="middle" font-size="10" font-weight="700" fill="${INK}">G${k[1]}</text>`};
 const draw=()=>{let h=`<rect x="0" y="0" width="360" height="292" fill="#BFE8A8"/>`;
  for(let c=0;c<=CW;c++)h+=`<path d="M${OX+c*C} ${OY}V${OY+RH*C}" stroke="#A5D58A" stroke-width="1"/>`;for(let r=0;r<=RH;r++)h+=`<path d="M${OX} ${OY+r*C}H${OX+CW*C}" stroke="#A5D58A" stroke-width="1"/>`;
  h+=`<rect x="${OX+B.x*C}" y="${OY+B.y*C}" width="${B.w*C}" height="${B.h*C}" rx="4" fill="#C9D2DE" stroke="${INK}" stroke-width="3"/><text x="${OX+(B.x+B.w/2)*C}" y="${OY+(B.y+B.h/2)*C}" text-anchor="middle" font-size="14" font-weight="700" fill="${INK}">DATA</text><text x="${OX+(B.x+B.w/2)*C}" y="${OY+(B.y+B.h/2)*C+16}" text-anchor="middle" font-size="14" font-weight="700" fill="${INK}">HALL</text>`;
  const ix=OX+IN.x*C,iy=OY+IN.y*C;
  h+=side==='w'?`<rect x="${ix-5}" y="${iy+2}" width="10" height="${IN.h*C-4}" fill="#9CCBFF" stroke="${INK}" stroke-width="2"/>${[1,2,3,4,5].map(i=>`<path d="M${ix-5} ${iy+i*IN.h*C/6}h10" stroke="${INK}" stroke-width="1.5"/>`).join('')}<text x="${ix+8}" y="${iy+IN.h*C/2+4}" font-size="10" font-weight="700" fill="#1C5FB0">AIR IN</text>`
   :`<rect x="${ix+2}" y="${iy+C-5}" width="${IN.w*C-4}" height="10" fill="#9CCBFF" stroke="${INK}" stroke-width="2"/>${[1,2,3,4,5,6,7].map(i=>`<path d="M${ix+i*IN.w*C/8} ${iy+C-5}v10" stroke="${INK}" stroke-width="1.5"/>`).join('')}<text x="${ix+IN.w*C/2}" y="${iy+C-10}" text-anchor="middle" font-size="10" font-weight="700" fill="#1C5FB0">AIR IN</text>`;
  h+=`<path d="M${OX-6} ${OY}V${OY+RH*C}" stroke="#E0A500" stroke-width="5" stroke-dasharray="10 6"/>`;
  const px=OX+POLE.x*C,py=OY+POLE.y*C;h+=`<path d="M${px+14} ${py+3}v22M${px+5} ${py+8}h18" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round"/><text x="${px+30}" y="${py+18}" font-size="9" font-weight="700" fill="#5A3A1B">POLE</text>`;
  for(const k in pos){const r=rect(k);h+=ico(k,OX+r.x*C,OY+r.y*C,r.w*C,r.h*C,bads.includes(k))}
  h+=`<text x="${OX+2}" y="${OY+RH*C+14}" font-size="10" fill="#2E5A2E">1 square = 5 ft</text>`;

 $('#yd').onclick=e=>{const sv=$('#yd'),bb=sv.getBoundingClientRect(),x=(e.clientX-bb.left)/bb.width*360,y=(e.clientY-bb.top)/bb.height*292;
  const cx=Math.floor((x-OX)/C),cy=Math.floor((y-OY)/C);
  const on=Object.keys(pos).find(k=>{const r=rect(k);return cx>=r.x&&cx<r.x+r.w&&cy>=r.y&&cy<r.y+r.h});
  if(on){delete pos[on];sel=on;bads=bads.filter(b=>b!==on);tick();msgEl(`Picked up the ${PC[on].n.toLowerCase()}. Tap a spot to set it down.`);draw();return}
  if(!sel){msgEl('Pick a piece above first.');return}
  const p=PC[sel],r={x:Math.min(Math.max(cx,0),CW-p.w),y:Math.min(Math.max(cy,0),RH-p.h),w:p.w,h:p.h};
  if(cx<0||cy<0||cx>=CW||cy>=RH)return;
  if(hit(r,B)||hit(r,POLE)||Object.keys(pos).some(k=>k!==sel&&hit(r,rect(k)))){bad();msgEl('It won\'t fit there.','bad');return}
  pos[sel]={x:r.x,y:r.y};tick();bads=bads.filter(b=>b!==sel);const nx=Object.keys(PC).find(k=>!pos[k]);sel=nx||null;msgEl('');draw()};
 $('#insp').onclick=()=>{
  const miss2=Object.keys(PC).filter(k=>!pos[k]);if(miss2.length){msgEl(`Place everything first: ${miss2.map(k=>PC[k].n.toLowerCase()).join(', ')}.`,'bad');bad();return}
  const v=[];bads=[];const add=(k,t)=>{v.push(t);if(!bads.includes(k))bads.push(k)};
  const X=rect('xf'),G=[rect('g1'),rect('g2')],T=rect('tk');
  if(gap(X,B).d<2)add('xf','Transformer is closer than 10 ft to the building.');
  if(gap(X,POLE).d>3)add('xf','Transformer is more than 15 ft from the pole.');
  G.forEach((g,i)=>{const k='g'+(i+1);if(gap(g,IN).e<4)add(k,`Generator ${i+1} exhaust is within 20 ft of the air intake. It would pump fumes into the data hall.`);if(gap(g,B).d<1)add(k,`Generator ${i+1} is right against the building. Leave 5 ft.`)});
  if(gap(G[0],G[1]).d<1){add('g1','The generators are touching. Leave 5 ft to work between them.');bads.push('g2')}

  if(gap(T,X).d<2)add('tk','The gas meter is within 10 ft of the transformer. Keep gas equipment away from anything that can arc.');
  if(gap(T,B).d<1)add('tk','The gas meter is right against the building.');
  if(v.length){miss++;bad();msgEl(`<b>Inspector says no:</b><br>• ${v.join('<br>• ')}`,'bad');draw();return}
  good();draw();msgEl('<b>Approved.</b> Clean layout.','ok');$('#insp').disabled=true;
  setTimeout(()=>result(j,dcStars(miss,0,1,3),'Equipment placement is safety. Oil-filled transformers can burn, so they sit away from the building. Generator exhaust has to stay far from air intakes or it gets pulled inside. Fuel lives near the generators but away from the transformer, and everything needs room for crews to work.'),1300)};
 draw();
}


/* Stage 2: land the services, find the neutral, check rotation */
function dcphase(){
 const j=J('dcphase');let svc=1,miss=0;
 const LUG=['A','B','C','N'],LC={A:'#8B5A2B',B:'#FF8A3D',C:'#FFD23C',N:'#F4F6F8'};
 shell(j,'The utility is this campus\'s backup, but it still has to be landed right. Two utility services feed the switchgear: 480Y/277 V. The cables come in all black and untagged. Find the neutral with your meter, land the cables, and prove the rotation before you energize. Wrong rotation runs every cooling fan backwards.',dcMini(1)+`<div id="ph"></div><div class="msg" id="msg"></div>`);
 function round(){
  const truth=shuffle(['A','B','C','N']); // truth[i] = what cable i really is
  const land=[null,null,null,null];let probe=[],selC=null,tested=false,reading='',rot=null;
  const draw=()=>{
   let h=`<div class="gamehud card"><span>Service <b>${svc}</b> of 2</span><span>Mistakes: <b>${miss}</b></span></div>
   <div class="stage card" style="padding:4px"><svg viewBox="0 0 360 300" style="display:block;width:100%">
   <rect x="0" y="0" width="360" height="300" fill="#E8F7FF"/>
   <rect x="20" y="210" width="320" height="78" rx="8" fill="#C9D2DE" stroke="${INK}" stroke-width="3"/><text x="180" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="${INK}">SWITCHGEAR MAIN LUGS</text>`;
   LUG.forEach((L,i)=>{const x=60+i*80;h+=`<g class="lg" data-l="${i}" style="cursor:pointer"><rect x="${x-24}" y="222" width="48" height="40" rx="6" fill="${LC[L]}" stroke="${INK}" stroke-width="3"/><text x="${x}" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="${INK}">${L}</text></g>`});
   for(let i=0;i<4;i++){const x=60+i*80,li=land.indexOf(i);const tx=li<0?x:60+li*80;const on=probe.includes(i),s=selC===i;
    h+=`<path d="M${x} 20 C${x} 120 ${tx} 120 ${tx} ${li<0?150:222}" fill="none" stroke="#1B1F27" stroke-width="9" stroke-linecap="round"/>
    <g class="cb" data-c="${i}" style="cursor:pointer"><rect x="${x-22}" y="50" width="44" height="30" rx="8" fill="${s?'#FFC93C':on?'#9CCBFF':'#fff'}" stroke="${INK}" stroke-width="3"/><text x="${x}" y="71" text-anchor="middle" font-size="16" font-weight="700" fill="${INK}">#${i+1}</text></g>`}
   h+=`<rect x="110" y="100" width="140" height="44" rx="10" fill="#FFC93C" stroke="${INK}" stroke-width="3"/><rect x="118" y="106" width="124" height="32" rx="6" fill="#C8E6B0" stroke="${INK}" stroke-width="2"/><text x="180" y="129" text-anchor="middle" font-size="18" font-weight="700" font-family="monospace" fill="${INK}">${reading||'--- V'}</text>`;
   if(rot)h+=`<g transform="translate(300 122)"><circle r="24" fill="#fff" stroke="${INK}" stroke-width="3"/><g><path d="M0 -14 A14 14 0 1 1 -14 0" fill="none" stroke="${rot==='cw'?'#1E8C4C':'#C0392B'}" stroke-width="4"/><path d="${rot==='cw'?'M-14 0l-5 -7M-14 0l6 -5':'M0 -14l7 -4M0 -14l6 5'}" stroke="${rot==='cw'?'#1E8C4C':'#C0392B'}" stroke-width="4" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0" to="${rot==='cw'?360:-360}" dur="1.6s" repeatCount="indefinite"/></g></g><text x="300" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="${INK}">${rot==='cw'?'A-B-C':'C-B-A'}</text>`;
   h+=`</svg></div>
   <p class="fine" style="margin:8px 2px 0">Tap two cable tags to read the voltage between them. To land a cable, tap its tag, then tap a lug. Tap a lug again to pull the cable off.</p>
   <div class="row" style="gap:8px;margin-top:10px"><button class="btn alt" id="rt" style="flex:1">Rotation test</button><button class="btn go" id="en" style="flex:1">Energize</button></div>`;
   $('#ph').innerHTML=h;
   $('#ph').querySelectorAll('.cb').forEach(g=>g.onclick=()=>{const i=+g.dataset.c;tick();
    if(selC===i){selC=null;draw();return}
    if(probe.length===1&&probe[0]!==i){probe.push(i);const a=truth[probe[0]],b=truth[i];reading=(a==='N'||b==='N')?'277 V':'480 V';selC=null;msgEl(`Cable #${probe[0]+1} to #${i+1}: <b>${reading}</b>`);probe=[];draw();return}
    probe=[i];selC=i;reading='';draw()});
   $('#ph').querySelectorAll('.lg').forEach(g=>g.onclick=()=>{const l=+g.dataset.l;
    if(selC===null){if(land[l]!==null){land[l]=null;tested=false;rot=null;tick();draw()}return}
    const old=land.indexOf(selC);if(old>=0)land[old]=null;land[l]=selC;selC=null;probe=[];tested=false;rot=null;tick();draw()});
   $('#rt').onclick=()=>{if(land.includes(null)){msgEl('Land all four cables first.','bad');bad();return}
    const nOk=truth[land[3]]==='N';
    if(!nOk){zap();miss++;msgEl(`The tester reads <b>277 V on the neutral bar</b>. A hot cable is on N. Meter the cables again and find the real neutral (it reads 277 V to every other cable).`,'bad');draw();return}
    const ord=[0,1,2].map(i=>truth[land[i]]).join('');rot=['ABC','BCA','CAB'].includes(ord)?'cw':'ccw';tested=true;tick();
    msgEl(rot==='cw'?'Clockwise, A-B-C. You\'re good to energize.':'<b>Counter-clockwise.</b> Swap any two phase cables and test again.',rot==='cw'?'ok':'bad');draw()};
   $('#en').onclick=()=>{if(land.includes(null)){msgEl('Land all four cables first.','bad');bad();return}
    const nOk=truth[land[3]]==='N';if(!nOk){zap();miss+=2;msgEl('<b>BANG.</b> A hot was on the neutral bar. That\'s why you test before you energize. Find the neutral.','bad');draw();return}
    const ord=[0,1,2].map(i=>truth[land[i]]).join('');const cw=['ABC','BCA','CAB'].includes(ord);
    if(!cw){miss++;bad();rot='ccw';msgEl('<b>The cooling fans are running backwards.</b> Rotation is C-B-A. Swap two phases. Always run the rotation test before you energize.','bad');draw();return}
    good();msgEl(tested?`Service ${svc} is live, A-B-C. Tested first, like a pro.`:`Service ${svc} is live. You got lucky: you didn't test rotation first.`,'ok');if(!tested)miss++;
    $('#en').disabled=true;$('#rt').disabled=true;
    setTimeout(()=>{if(svc<2){svc++;round()}else result(j,dcStars(miss,0,1,3),'On a 480Y/277 V service, phase to phase reads 480 V and phase to neutral reads 277 V. So the neutral is the one cable that reads 277 V to all the others. Phase rotation decides which way every 3-phase motor spins. Swap any two phases to reverse it, and always prove it with a rotation meter before you energize.')},1500)};
  };
  draw();msgEl(`Service ${svc}: start by metering the cables.`);
 }
 round();
}


/* Stage 3: main-tie-main switchgear, timed */
function dcgear(){
 const j=J('dcgear');let miss=0,ri=0,left=0,lock=false,busy=false;
 const g={U1:true,U2:true,M1:false,M2:false,T:false,fault:false};
 const live=()=>{const b1a=g.M1&&g.U1,b2a=g.M2&&g.U2;let b1=b1a,b2=b2a;if(g.T){b1=b1||b2a;b2=b2||b1a}return{b1,b2}};
 const RS=[
  {t:'Startup: both utilities are up and the halls are on UPS batteries. Set the gear for a normal day.',set:()=>{},ok:()=>g.M1&&g.M2&&!g.T},
  {t:'<b>Utility 1 just dropped!</b> Hall A is on batteries. Get it power.',set:()=>{g.U1=false},ok:()=>{const l=live();return l.b1&&l.b2&&!g.M1}},
  {t:'Utility 1 is back and stable. Return the gear to normal.',set:()=>{g.U1=true},ok:()=>g.M1&&g.M2&&!g.T},
  {t:'<b>Fault on Bus 2!</b> M2 tripped. Keep Hall A running, isolate Bus 2, and lock out M2 for the crew.',set:()=>{g.fault=true;g.M2=false},ok:()=>g.M1&&!g.M2&&!g.T&&lock,lock:true},
  {t:'Bus 2 is repaired. Now the utility is taking Utility 2 down for maintenance. Keep both halls running.',set:()=>{g.fault=false;lock=false;g.U2=false},ok:()=>{const l=live();return l.b1&&l.b2&&!g.M2}}];
 shell(j,'Before the engines are commissioned, the building runs on its two utility feeds, and they stay as the backup forever. Main-tie-main switchgear: two utilities, two buses, one tie breaker. Run the gear through the day. When a bus goes dead, its hall runs on UPS batteries, and they don\'t last. In switchgear, <b style="color:#C0392B">red = closed</b> and <b style="color:#1E8C4C">green = open</b>.',
 dcMini(2)+`<div class="gamehud card"><span>Round <b id="rn">1</b> of ${RS.length}</span><span>Mistakes: <b id="mi">0</b></span></div><div class="qcard card" style="padding:12px 14px" id="rt"></div>

  <text x="250" y="200" font-size="12" font-weight="700" fill="${INK}">FAST ↻</text><text x="74" y="200" font-size="12" font-weight="700" fill="${INK}">↺ SLOW</text><text x="180" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7684">SYNC SCOPE</text>
  <path d="M180 118L${nx} ${ny}" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="118" r="8" fill="${INK}"/>
  <text x="180" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="${INK}">${Math.abs(df)>.5?'Needle spinning too fast to catch':fast?'Engine running fast':df<0?'Engine running slow':'Frequencies matched exactly (needle frozen)'}</text>`;
  $('#gn').textContent=gi;$('#mi').textContent=miss};
 function startG(){done=false;const hi=Math.random()<.5;f=+(hi?60.5+Math.random()*.6:58.9+Math.random()*.6).toFixed(2);v=Math.round(462+Math.random()*36);if(Math.abs(v-480)<12)v+=v<480?-14:14;ang=Math.random()*360;tl=100;

/* Stage 5: wire a battery tray in series, then size strings N+1 */
function dcbatt(){
 const j=J('dcbatt');let miss=0;
 shell(j,'The UPS needs its batteries. First, wire a tray of eight 12 V blocks in series for 96 V. Watch the polarity: the blocks aren\'t all facing the same way. Then size how many strings the UPS needs.',dcMini(4)+`<div id="bt"></div><div class="msg" id="msg"></div>`);
 function part1(){
  const pol=[...Array(8)].map(()=>Math.random()<.5); // true: + on left
  const P=i=>{const r=i<4?0:1,c=r?3-(i-4):i;return{x:24+c*80,y:r?170:70}};
  const N={TP:{x:20,y:28},TN:{x:20,y:262}};
  for(let i=0;i<8;i++){const p=P(i);N[i+(pol[i]?'p':'n')]={x:p.x+12,y:p.y+8};N[i+(pol[i]?'n':'p')]={x:p.x+52,y:p.y+8}}
  let J2=[],sel=null;
  const other=n=>{const q=J2.find(p=>p.includes(n));return q?(q[0]===n?q[1]:q[0]):null};
  const draw=()=>{let h=`<rect width="360" height="300" fill="#E8F7FF"/>`;
   for(let i=0;i<8;i++){const p=P(i);h+=`<rect x="${p.x}" y="${p.y}" width="64" height="62" rx="6" fill="#3A3F4A" stroke="${INK}" stroke-width="3"/><text x="${p.x+32}" y="${p.y+44}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">12 V</text>`}
   J2.forEach(([a,b])=>{const A=N[a],B=N[b];const my=Math.min(A.y,B.y)-26;h+=`<path d="M${A.x} ${A.y}C${A.x} ${my} ${B.x} ${my} ${B.x} ${B.y}" fill="none" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>`});
   for(const k in N){const n=N[k],isP=k.endsWith('p')||k==='TP',s=sel===k;
    if(k==='TP'||k==='TN'){h+=`<g class="tm" data-n="${k}" style="cursor:pointer"><rect x="${n.x-12}" y="${n.y-12}" width="24" height="24" rx="5" fill="${s?'#FFC93C':isP?'#FF5A5A':'#5A6270'}" stroke="${INK}" stroke-width="3"/><text x="${n.x+18}" y="${n.y+5}" font-size="12" font-weight="700" fill="${INK}">TRAY ${isP?'+':'−'}</text></g>`;continue}
    h+=`<g class="tm" data-n="${k}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="13" fill="${s?'#FFC93C':isP?'#FF5A5A':'#1B1F27'}" stroke="${INK}" stroke-width="3"/><text x="${n.x}" y="${n.y+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">${isP?'+':'−'}</text></g>`}
   $('#bsv').innerHTML=h;
   $('#bsv').querySelectorAll('.tm').forEach(g=>g.onclick=()=>{const k=g.dataset.n;
    if(sel===null){const o=other(k);if(o){J2=J2.filter(p=>!p.includes(k));tick();draw();return}sel=k;tick();draw();return}
    if(sel===k){sel=null;draw();return}
    if(other(k)){bad();msgEl('That terminal already has a jumper. Tap it first to pull it off.','bad');sel=null;draw();return}
    const a=sel,b=k;sel=null;
    if(a.length===2&&b.length===2&&a[0]===b[0]){zap();miss++;msgEl('<b>Dead short!</b> You jumped a block\'s own + to its −. Sparks, a welded wrench, and a cooked battery.','bad');draw();return}
    if((a==='TP'||a==='TN')&&(b==='TP'||b==='TN')){zap();miss++;msgEl('<b>Dead short</b> across the tray output.','bad');draw();return}
    J2.push([a,b]);tick();draw()})};
  $('#bt').innerHTML=`<div class="stage card" style="padding:4px"><svg id="bsv" viewBox="0 0 360 300" style="display:block;width:100%"></svg></div><p class="fine" style="margin:8px 2px 0">Tap a terminal, then another, to run a jumper. Tap a terminal with a jumper to remove it.</p><button class="btn go" id="ms" style="width:100%;margin-top:10px">Measure the tray</button><div class="meter card" style="margin-top:10px;padding:10px;text-align:center"><b id="rd" style="font-family:monospace;font-size:26px">--- V</b></div>`;
  $('#ms').onclick=()=>{let cur='TP',V=0,seen=new Set(),ok=true;
   for(let s=0;s<20;s++){const o=other(cur);if(!o){ok=false;break}if(o==='TN')break;if(o==='TP'){ok=false;break}const b=o[0];if(seen.has(b)){ok=false;break}seen.add(b);const ent=o[1];V+=ent==='p'?12:-12;cur=b+(ent==='p'?'n':'p')}
   const end=ok&&other(cur)==='TN';
   $('#rd').textContent=end?`${V.toFixed(1)} V`:'OL (open)';
   if(end&&V===96&&seen.size===8){good();msgEl('<b>96.0 V.</b> All eight blocks in series, polarity right.','ok');$('#ms').disabled=true;setTimeout(part2,1500);return}
   miss++;bad();msgEl(!end?'Open circuit. The chain doesn\'t run from TRAY + through the blocks to TRAY −.':V<96&&seen.size===8?`Only ${V} V. A block is in backwards: you went + to + or − to −. Series means − of one block to + of the next.`:`${V} V. Not all eight blocks are in the string.`,'bad')};
  draw();msgEl('Start at TRAY +.');
 }
 function part2(){
  const L=[300,400,500,600][Math.floor(Math.random()*4)],per=125,N1=Math.ceil(L/per),need=N1+1;let n=1;
  const draw=()=>{$('#cab').innerHTML=`<svg viewBox="0 0 360 120" style="display:block;width:100%"><rect width="360" height="120" fill="#E8F7FF"/>${[...Array(n)].map((_,i)=>`<g transform="translate(${10+i*44} 14)"><rect width="38" height="92" rx="5" fill="#5A6270" stroke="${INK}" stroke-width="3"/>${[0,1,2,3,4,5].map(k=>`<rect x="5" y="${6+k*14}" width="28" height="10" rx="2" fill="#3A3F4A"/>`).join('')}<circle cx="31" cy="11" r="3" fill="#35C76F"/></g>`).join('')}</svg>`;$('#nn').textContent=n};
  $('#bt').innerHTML=`<div class="qcard card"><h3>Size the battery plant</h3><p class="q" style="font-size:17px">UPS load: <b>${L} kW</b><br>Each string: <b>${per} kW for 5 minutes</b></p><p style="margin:6px 0 0">Spec: 5 minutes at full load, <b>N+1</b> (one spare string, so one bad string can't drop the load).</p></div>
  <div class="stage card" style="padding:4px" id="cab"></div><div class="row" style="gap:8px;margin-top:10px;align-items:center"><button class="btn alt" id="sm" style="flex:1">− String</button><b style="font-size:22px;min-width:60px;text-align:center"><span id="nn">1</span></b><button class="btn alt" id="sp" style="flex:1">+ String</button></div><button class="btn go" id="sd" style="width:100%;margin-top:10px">Commission</button>`;
  $('#sm').onclick=()=>{if(n>1){n--;tick();draw()}};$('#sp').onclick=()=>{if(n<8){n++;tick();draw()}};
  $('#sd').onclick=()=>{if(n<N1){miss++;bad();msgEl(`${n} × ${per} = ${n*per} kW. That can't even carry ${L} kW.`,'bad');return}
   if(n===N1){miss++;bad();msgEl(`${n} strings carry the load with nothing to spare. One weak string and the UPS drops. Spec says N+1.`,'bad');return}
   if(n>need){miss++;bad();msgEl(`It works, but that's ${n-need} more string${n-need>1?'s':''} than spec, at about $40,000 each. N = ${N1}, so N+1 = ${need}.`,'bad');return}
   good();$('#sd').disabled=true;msgEl(`${L} ÷ ${per} = ${L%per?(L/per).toFixed(1)+', round up to '+N1:N1}. Plus one spare = <b>${need} strings</b>.`,'ok');
   setTimeout(()=>result(j,dcStars(miss,0,1,3),'Batteries in series add voltage: − of one to + of the next. Jump + to + and that block fights the others. Jump a block\'s own + to − and it\'s a dead short. A UPS battery plant is sized for runtime at full load, plus redundancy: N+1 means one extra string, so any single string can fail without dropping the load.'),1500)};
  draw();msgEl('');
 }
 part1();
}

/* 6. Pull the feeders: parallel sets + one set per conduit */

 function p1(){const draw=()=>{$('#fd').innerHTML=`<div class="qcard card" style="padding:12px 14px"><h3 style="margin:0">How many parallel sets?</h3><p style="margin:4px 0 0">${F} A breaker · 500 kcmil = 380 A each</p></div>
   <div class="stage card" style="padding:4px"><svg viewBox="0 0 360 120" style="display:block;width:100%"><rect width="360" height="120" fill="#E8F7FF"/>${[...Array(sets)].map((_,k)=>`<g transform="translate(${20+k*56} 20)"><circle cx="22" cy="40" r="22" fill="#C5CDD6" stroke="${INK}" stroke-width="3"/>${['A','B','C','N'].map((p,q)=>`<circle cx="${14+(q%2)*16}" cy="${32+Math.floor(q/2)*16}" r="6.5" fill="${PC[p][0]}" stroke="${INK}" stroke-width="1.5"/>`).join('')}</g>`).join('')}<text x="350" y="112" text-anchor="end" font-size="13" font-weight="700" fill="${sets*AMP>=F?'#1E8C4C':'#C0392B'}">${sets} × 380 = ${sets*AMP} A</text></svg></div>
   <div class="row" style="gap:8px;margin-top:10px;align-items:center"><button class="btn alt" id="sm" style="flex:1">− Set</button><b style="font-size:22px;min-width:40px;text-align:center">${sets}</b><button class="btn alt" id="sp" style="flex:1">+ Set</button></div><button class="btn go" id="ok" style="width:100%;margin-top:10px">Order the wire</button>`;
   $('#sm').onclick=()=>{if(sets>1){sets--;tick();draw()}};$('#sp').onclick=()=>{if(sets<6){sets++;tick();draw()}};
   $('#ok').onclick=()=>{if(sets*AMP<F){miss++;msgEl(sets*AMP>=F-150?`${sets*AMP} A is close, but over 800 A there's no rounding up to the next breaker size. The conductors must be rated for the <b>full ${F} A</b>. Add a set.`:`${sets*AMP} A won't carry a ${F} A feeder. It overheats.`,'bad');return}
    if(sets>need){miss++;msgEl(`That works, but it's an extra run of copper you don't need. ${need} sets × 380 = ${need*AMP} A covers it.`,'bad');return}

 function p2(){const cond=[];for(let s=0;s<need;s++)for(const p of ['A','B','C','N'])cond.push({p,len:250});
  const bad2=Math.floor(Math.random()*cond.length);const spare={p:cond[bad2].p,len:250};cond[bad2].len=238;cond.push(spare);

   <button class="btn go" id="pl" style="width:100%;margin-top:10px">Pull it</button>`;
   app.querySelectorAll('.cw').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;tick();draw()});
   app.querySelectorAll('.tube').forEach(b=>b.onclick=()=>{const t=tubes[+b.dataset.t];if(sel===null){if(t.length){t.pop();tick();draw()}return}if(t.length>=4){msgEl('That conduit is full. Tap it with nothing selected to pull a wire back out.');return}t.push(sel);sel=null;tick();draw()});

 shell(j,'Build 3 power whips: heavy cords with a 5-pin pin-and-sleeve plug that plugs into the tap-off box. The site standard for 415 V is <b>brown, orange, yellow</b> for L1, L2, L3, <b>gray</b> neutral and <b>green</b> ground. The plug face turns on every whip, so read the pins. The foreman wants them before the crane leaves.',

  PIN.forEach(([k,t],i)=>{const a=(rot+i*72)*Math.PI/180,x=180+Math.sin(a)*52,y=115-Math.cos(a)*52,r=k==='G'?17:13,wc=on[k];

/* 13. Rack power-up */
function dcpower(){
 const j=J('dcpower');let miss=0;const badW=Math.random()<.5?'A':'B';
 const st={mg:false,fix:false,vt:false,A:false,B:false,leds:false,fail:false};
 shell(j,'Commissioning day for one GPU rack. Power it up the right way: prove the whips are healthy, prove the voltage, bring up feed A, then B, then prove the rack survives losing a feed.',
 dcMini(7)+`<div class="stage card" style="padding:4px"><svg id="pu" viewBox="0 0 360 200" style="display:block;width:100%"></svg></div>
 <div class="opts" id="ac"></div><div class="msg" id="msg"></div>`);
 const draw=()=>{const I=INK,A=st.A,B=st.B;
  $('#pu').innerHTML=`<rect width="360" height="200" fill="#2B2F36"/><rect x="10" y="12" width="160" height="14" rx="4" fill="#2F7FE0"/><rect x="190" y="12" width="160" height="14" rx="4" fill="#E0702F"/>
  <rect x="68" y="26" width="44" height="26" rx="4" fill="${A?'#FF5A5A':'#35C76F'}" stroke="${I}" stroke-width="2"/><text x="90" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="${I}">TOB A</text>
  <rect x="248" y="26" width="44" height="26" rx="4" fill="${B?'#FF5A5A':'#35C76F'}" stroke="${I}" stroke-width="2"/><text x="270" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="${I}">TOB B</text>
  <path d="M90 52V80H150M270 52V80H210" fill="none" stroke="${A?'#2F7FE0':'#5A6270'}" stroke-width="5"/>${B?'<path d="M270 52V80H210" fill="none" stroke="#E0702F" stroke-width="5"/>':''}
  ${st.mg&&!st.fix?`<text x="${badW==='A'?90:270}" y="100" text-anchor="middle" font-size="18">⚠️</text>`:''}
  <rect x="150" y="70" width="60" height="122" rx="5" fill="#3A3F4A" stroke="#9AA4B2" stroke-width="2"/>${[...Array(8)].map((_,k)=>{const on=k<4?A:B;return `<rect x="156" y="${76+k*14}" width="48" height="10" rx="2" fill="#2B2F36"/><circle cx="198" cy="${81+k*14}" r="3" fill="${on?'#35C76F':'#5A6270'}"/>`}).join('')}
  <text x="40" y="140" font-size="11" font-weight="700" fill="#9CCBFF">A shelves 1–4</text><text x="230" y="186" font-size="11" font-weight="700" fill="#FFC29A">B shelves 5–8</text>`;
  const acts=[['mg','Megger both whips'],['fix',`Replace whip ${badW}`],['vt','Meter 415 V at both tap boxes'],['ca','Close TOB A'],['cb','Close TOB B'],['oa','Open TOB A (failover test)']];
  $('#ac').innerHTML=acts.filter(([k])=>k!=='fix'||(st.mg&&!st.fix)).map(([k,t])=>`<button class="btn alt" data-a="${k}">${t}</button>`).join('');
  $('#ac').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a))};
 function act(a){tick();
  if(a==='mg'){st.mg=true;msgEl(`Megger at 1,000 V: whip ${badW==='A'?'B':'A'} reads <b>&gt;2,000 MΩ</b>, good. Whip ${badW} reads <b>0.4 MΩ</b>: the insulation is nicked somewhere. Don't energize that one.`,'ok');draw();return}
  if(a==='fix'){st.fix=true;msgEl(`New whip ${badW} megs &gt;2,000 MΩ. Good.`,'ok');draw();return}
  if(a==='vt'){if(!st.mg){miss++;msgEl('Test the whips first. Voltage at the tap box tells you nothing about a damaged cord.','bad');return}st.vt=true;msgEl('415 V phase to phase, 240 V phase to neutral, at both tap boxes. Rotation checks good.','ok');draw();return}
  if(a==='ca'||a==='cb'){const w=a==='ca'?'A':'B';
   if(!st.mg||(badW===w&&!st.fix)){miss++;msgEl(`<b>BANG.</b> Whip ${w} had nicked insulation and it faulted the second you closed the tap box. That's what the megger test is for.`,'bad');st.mg=true;draw();return}
   if(!st.vt){miss++;msgEl('Prove the voltage at the tap box before you energize a rack. Wrong voltage would cook the power shelves.','bad');return}
   if(w==='B'&&!st.A){miss++;msgEl('Bring up A first and check its shelves, then B. One feed at a time, so if something\'s wrong you know which feed it is.','bad');return}
   st[w]=true;good();msgEl(w==='A'?'TOB A closed: shelves 1 to 4 lit, rack booting on A.':'TOB B closed: all 8 shelves lit. Both feeds live.','ok');draw();return}
  if(a==='oa'){if(!st.A||!st.B){miss++;msgEl('Both feeds have to be live before you test failover. Pull one with only one up and you just turned the rack off.','bad');return}
   st.A=false;draw();good();confetti();msgEl('<b>TOB A open. Rack still running on B.</b> Failover proven. Close A back up, label it, done.','ok');
   setTimeout(()=>result(j,dcStars(miss,0,1,3),'Commissioning follows a ritual for a reason. Megger the cords so a damaged one never gets energized. Prove the voltage before the equipment sees it. Energize one feed at a time, so a problem shows up on a known feed. Finish by pulling a feed to prove the redundancy actually works.'),1800)}}
 draw();
}

/* Stage 12: ground grid + EPO */
function dcground(){
 const j=J('dcground');let miss=0;
 const R={x:100,y:34,w:170,h:156};
 const IT=shuffle([['Transformer',true,'A transformer case'],['Generator 1',true],['Generator 2',true],['Gas meter',true],['Fence',true],['Building steel',true],['Metal water pipe',true],['Gas pipe',true,'Gas pipe gets bonded (it\'s just never used as an electrode)'],['PVC drain line',false,'PVC. There\'s no metal to bond.'],['Fiberglass ladder',false,'Fiberglass doesn\'t conduct. Nothing to bond.']]);
 const POS=[[44,30],[44,80],[44,130],[44,180],[44,232],[150,224],[250,224],[314,180],[314,110],[314,40]];
 const bond={};
 shell(j,'The ground ring is buried around the building. First, bond every piece of metal on site to it so nothing can sit at a different voltage. Then drive ground rods until the grid tests at <b>5 ohms or less</b> (the data center spec, way tighter than NEC\'s 25 for a single rod).',dcMini(6)+`<div id="gd"></div><div class="msg" id="msg"></div>`);
 function part1(){
  const draw=()=>{let h=`<rect width="360" height="260" fill="#BFE8A8"/><rect x="${R.x+14}" y="${R.y+14}" width="${R.w-28}" height="${R.h-28}" rx="6" fill="#C9D2DE" stroke="${INK}" stroke-width="3"/><text x="${R.x+R.w/2}" y="${R.y+R.h/2+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">DATA HALL</text><rect x="${R.x}" y="${R.y}" width="${R.w}" height="${R.h}" rx="10" fill="none" stroke="#1E8C4C" stroke-width="5" stroke-dasharray="10 6"/>`;
   IT.forEach(([n],i)=>{const [x,y]=POS[i];if(bond[i]){const tx=Math.min(Math.max(x,R.x),R.x+R.w),ty=Math.min(Math.max(y,R.y),R.y+R.h);h+=`<path d="M${x} ${y}L${tx} ${ty}" stroke="#B87333" stroke-width="5"/><circle cx="${tx}" cy="${ty}" r="5" fill="#B87333" stroke="${INK}" stroke-width="2"/>`}});
   IT.forEach(([n],i)=>{const [x,y]=POS[i];h+=`<g class="it" data-i="${i}" style="cursor:pointer"><rect x="${x-38}" y="${y-13}" width="76" height="26" rx="8" fill="${bond[i]?'#9BE3AE':'#fff'}" stroke="${INK}" stroke-width="2.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="${n.length>12?8.5:9.5}" font-weight="700" fill="${INK}">${n}</text></g>`});
   $('#gsv').innerHTML=h};
  $('#gd').innerHTML=`<div class="stage card" style="padding:4px"><svg id="gsv" viewBox="0 0 360 260" style="display:block;width:100%"></svg></div><p class="fine" style="margin:8px 2px 0">Tap each thing that needs a bonding jumper welded to the ring. Tap again to remove it.</p><button class="btn go" id="tt" style="width:100%;margin-top:10px">Touch-voltage test</button>`;
  $('#gsv').onclick=e=>{const g=e.target.closest('.it');if(!g)return;const i=+g.dataset.i;
   if(!IT[i][1]&&!bond[i]){miss++;bad();msgEl(`${IT[i][0]}: ${IT[i][2]}`,'bad');return}
   bond[i]=!bond[i];tick();draw()};
  $('#tt').onclick=()=>{const un=IT.map((t,i)=>t[1]&&!bond[i]?t[0]:null).filter(Boolean);
   if(un.length){miss++;zap();msgEl(`<b>Shock hazard:</b> ${un.join(', ')} ${un.length>1?'are':'is'} sitting at a different voltage than the ring. Bond ${un.length>1?'them':'it'}.`,'bad');return}
   good();$('#tt').disabled=true;msgEl('Every piece of metal is at the same potential. Now the rods.','ok');setTimeout(part2,1500)};
  draw();msgEl('');
 }
 function part2(){
  const SL=24,rods=new Set();let tests=0;
  const sp=k=>{const t=k/SL*(2*(R.w+R.h)),W=R.w,H=R.h;if(t<W)return[R.x+t,R.y];if(t<W+H)return[R.x+W,R.y+t-W];if(t<2*W+H)return[R.x+W-(t-W-H),R.y+H];return[R.x,R.y+H-(t-2*W-H)]};
  const ohms=()=>{const a=[...rods];let sum=0;a.forEach(k=>{let g=SL;a.forEach(m=>{if(m!==k){const d=Math.min(Math.abs(k-m),SL-Math.abs(k-m));g=Math.min(g,d)}});sum+=Math.min(1,g/3)});return 25/(1+.6*sum)};
  const draw=()=>{let h=`<rect width="360" height="230" fill="#BFE8A8"/><rect x="${R.x+14}" y="${R.y+14}" width="${R.w-28}" height="${R.h-28}" rx="6" fill="#C9D2DE" stroke="${INK}" stroke-width="3"/><rect x="${R.x}" y="${R.y}" width="${R.w}" height="${R.h}" rx="2" fill="none" stroke="#1E8C4C" stroke-width="5"/>`;
   for(let k=0;k<SL;k++){const [x,y]=sp(k),on=rods.has(k);h+=`<g class="sl" data-k="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?9:6}" fill="${on?'#B87333':'#fff'}" stroke="${INK}" stroke-width="2.5"/>${on?`<path d="M${x} ${y-4}v8" stroke="${INK}" stroke-width="2"/>`:''}</g>`}
   h+=`<text x="${R.x+R.w/2}" y="${R.y+R.h/2}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">Rods: ${rods.size}/10</text>`;

  $('#gsv').onclick=e=>{const g=e.target.closest('.sl');if(!g)return;const k=+g.dataset.k;if(rods.has(k))rods.delete(k);else{if(rods.size>=10){bad();msgEl('Ten rods max on this job.','bad');return}rods.add(k)}tick();draw()};

   good();$('#fp').disabled=true;msgEl(`<b>${r.toFixed(1)} Ω.</b> Under 5. That grid will carry a fault and a lightning strike.`,'ok');
   setTimeout(()=>{const m={v:miss};dcEpo(j,m,()=>result(j,dcStars(m.v,0,2,4),'The EPO button kills the hall and its cooling, but never life safety. Bonding puts every piece of metal at the same voltage, so nobody gets shocked touching two things at once. That includes the gas pipe, which gets bonded even though it can never be an electrode. Ground rods lower the resistance to earth, but only when they\'re spaced out. Rods closer than about twice their length share the same soil and barely help.'))},1500)};

}
