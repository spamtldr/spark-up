<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Spark Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a bright, chunky phone game for apprentice electricians; playful but the facts are exact.
IDEA: a job-site work order board: take jobs, earn pay, climb from apprentice to journeyman.
PICTURE: each job is a cartoon play surface (receptacle, floor plan, tile grid, live panel).
COLOUR and TYPE: sky blue ground, safety yellow, ink outlines with hard drop shadows; Fredoka.
LAYOUT: one 480px column, HUD on top, cards stacked, big tap targets.
*/
:root{--sky:#5EC8F2;--ink:#1B2A41;--yel:#FFC93C;--org:#FF8A3D;--grn:#35C76F;--red:#FF5A5A;--pap:#FFF8E7;--blu:#2F7FE0;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:17px/1.45 Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--sky);min-height:100vh;overflow-x:clip}

#app{max-width:480px;margin:0 auto;padding:12px 12px 100px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font-weight:600;font-size:18px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;min-height:50px;background:var(--yel);color:var(--ink);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.alt{background:#fff}.btn.go{background:var(--grn)}.btn.sm{min-height:42px;font-size:15px;padding:6px 12px}
.btn.big{font-size:24px;padding:14px 28px;min-height:62px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:14px}
.rank{display:flex;align-items:center;gap:8px;flex:1}
.rank svg{width:40px;height:40px;flex:none}
.rank small{display:block;font-size:13px;opacity:.7;line-height:1}.rank b{font-weight:600;font-size:16px;line-height:1.15}
.cash{font-weight:700;font-size:20px;background:var(--grn);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;-webkit-text-stroke:.5px var(--ink)}
.mute{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:var(--pap);display:grid;place-items:center;padding:0}
.mute svg{width:24px;height:24px}
.sec{font-size:26px;font-weight:700;margin:4px 4px 10px;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.job{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px 12px;background:#fff;position:relative;overflow:hidden}
.job::before{content:"";position:absolute;inset:0 0 auto 0;height:58px;background:var(--c);border-bottom:3px solid var(--ink)}
.job:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.jic{position:relative;width:50px;height:50px;margin-bottom:12px}.jic svg{width:100%;height:100%}
.kind{font-size:13px;font-weight:600;text-transform:none;opacity:.7}
.jt{font-weight:600;font-size:16px;line-height:1.2;margin:2px 0 6px;min-height:2.4em}
.pay{font-weight:700;color:#1E8C4C}
.stars{display:flex;gap:2px;margin-top:4px}.stars svg{width:20px;height:20px}
.stars.lg{justify-content:center;gap:6px;margin:6px 0}.stars.lg svg{width:52px;height:52px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:3px solid var(--ink);border-radius:12px;background:#fff;min-height:44px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--ink)}.tab.on{background:var(--yel)}.tab:disabled{opacity:.5;box-shadow:none}
.roster{display:grid;gap:8px}
.mem{display:flex;align-items:center;gap:10px;padding:8px 10px;box-shadow:0 3px 0 var(--ink)}
.mem.me.cs-plain{background:#FFF3C4}
.pos{font-weight:700;width:22px;text-align:center;flex:none}
.av{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.mi{flex:1}.mi b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}.mi em{font-style:normal;font-size:12px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:2px}.mi small{font-size:14px;opacity:.75}
.ms{display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}.ms .stars{margin:0}
.news{padding:4px 12px}.nw{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed #D3D9E0}.nw:last-child{border:0}.nw small{white-space:nowrap;opacity:.7;font-size:13px}
.ce{padding:12px 14px;margin-bottom:12px;background:#FFE1E1}.ce b{font-weight:700;font-size:17px}.ce p{margin:4px 0 8px;font-size:15px}
.cebadge{font-size:12px;font-weight:700;background:#FF5A5A;color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tags{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.tg{background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700;padding:1px 8px}.tg.nw{background:var(--red);color:#fff}
.job.held{opacity:.55}
.dailybar{padding:10px 12px;margin-bottom:12px;background:var(--yel);font-size:15px;cursor:pointer}.dailybar b{font-weight:700}.dailybar span{float:right;font-weight:600;opacity:.7}
.codebox{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;margin-top:12px}.codebox b{font-weight:600}.codebox small{display:block;font-size:13px;opacity:.75}.codebox .btn{white-space:nowrap;font-variant-numeric:tabular-nums}
.gear{display:flex;gap:6px;margin-top:2px}
.earn2{font-weight:700;color:#1E8C4C;white-space:nowrap;font-size:17px}
.sh{font-size:20px;font-weight:700;margin:16px 4px 8px;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;text-align:center}.si>svg{width:72px;height:52px}.si b{font-weight:600;font-size:15px}.si .btn{width:100%;min-height:42px;font-size:15px;padding:6px 8px}.si.eq{background:#FFF3C4}
.inp{display:block;width:100%;margin:8px 0 6px;font:500 18px Fredoka,system-ui,sans-serif;padding:12px;border:3px solid var(--ink);border-radius:12px;min-height:50px}
.err{margin:0 0 10px;font-size:14px;color:#C0392B;min-height:20px}
.seg.on{background:var(--yel)}
.cash{cursor:pointer;font-family:inherit}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.cats .tab{flex:none;padding:0 12px}
.si.locked>svg,.si.locked>.sw{opacity:.85}
.sw{display:grid;place-items:center;width:84px;height:52px;border:3px solid var(--ink);border-radius:12px;font-size:20px}
.cs-plain{background:#fff}
.cs-blueprint{background-color:#1F5FAE;background-image:linear-gradient(#ffffff26 1px,transparent 1px),linear-gradient(90deg,#ffffff26 1px,transparent 1px);background-size:14px 14px;color:#fff}
.cs-hazard{background:#fff;border-image:repeating-linear-gradient(45deg,#1B2A41 0 10px,#FFC93C 10px 20px) 6;border-width:6px;border-style:solid}
.cs-plate{background-color:#C9CFD6;background-image:radial-gradient(ellipse 4px 1.5px at 25% 25%,#ffffff99 99%,transparent),radial-gradient(ellipse 1.5px 4px at 75% 75%,#ffffff99 99%,transparent);background-size:16px 16px}
.cs-neon{background:#151A33;color:#fff;box-shadow:0 0 0 3px #FF6FB5 inset,0 0 14px #FF6FB5,0 5px 0 var(--ink)}
.cs-goldcard{background:linear-gradient(135deg,#B8801A,#FFE48A 45%,#C99528)}
.mem.cs-blueprint small,.mem.cs-neon small{color:#E6F0FF;opacity:1}.mem.cs-blueprint .earn2,.mem.cs-neon .earn2{color:#7BFFB0}
.mem{cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--ink)}
.mem.cs-blueprint,.mem.cs-neon,.pband.cs-blueprint,.pband.cs-neon{color:#fff}
.pband{border:3px solid var(--ink);border-radius:14px;padding:10px;margin-bottom:12px}
.cpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.cp{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px;display:grid;place-items:center;gap:2px;min-height:96px}.cp.on{background:#FFF3C4}.cp small{font-size:13px;font-weight:600}
.dots7{display:flex;gap:3px}.dots7 i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.news{padding:4px 12px}.nt{display:flex;justify-content:space-between;gap:10px}.nt small{white-space:nowrap;opacity:.7;font-size:13px}
.nw{display:block;padding:10px 0;border-bottom:2px dashed #D3D9E0}.nw:last-child{border:0}
.rx{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.rb{border:2px solid var(--ink);border-radius:999px;background:#fff;min-height:34px;min-width:44px;padding:2px 10px;font-size:15px}.rb b{font-weight:700;font-size:13px}.rb.on{background:var(--yel)}
.cmts{margin-top:8px;background:#F4F7FA;border-radius:10px;padding:8px 10px}.cmts p{margin:0 0 6px;font-size:15px;overflow-wrap:anywhere}.cmts b{font-weight:600}
.cin{display:flex;gap:6px}.cin input{flex:1;font:500 16px Fredoka,system-ui,sans-serif;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;min-height:44px}
.mem:active{transform:translateY(2px)}
.prof{text-align:center}.prof h2{margin:0;font-size:28px;overflow-wrap:anywhere}.prof .pr{margin:2px 0 12px;font-size:15px}
.prof.cs-blueprint .pstats div,.prof.cs-neon .pstats div{color:var(--ink)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.pstats div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px}.pstats small{display:block;font-size:13px;opacity:.75}.pstats strong{font-size:18px;font-weight:700}
.prow{display:flex;justify-content:center;gap:16px;margin-bottom:10px}.prow div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;color:var(--ink)}.prow small{display:block;font-size:13px}
.ptools{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px}
.pt{display:grid;place-items:center;border-radius:8px}.pt.no{opacity:.18;filter:grayscale(1)}.pt.fav{background:#FFF3C4;box-shadow:0 0 0 2px var(--ink)}
.prof .fine{color:inherit}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;gap:6px;padding:6px 10px 10px;background:#fff;border-top:3px solid var(--ink)}
.bnav button{flex:1;max-width:140px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;font-weight:600;font-size:14px;min-height:52px}
.bnav button svg{width:28px;height:28px}.bnav button.on{background:var(--yel);box-shadow:0 0 0 2.5px var(--ink) inset}
.meb{display:flex;align-items:center;gap:8px;flex:1;border:0;background:none;padding:0;text-align:left}.meb>svg{width:42px;height:42px;flex:none}.meb small{display:block;font-size:13px;opacity:.7;line-height:1}.meb b{font-weight:600;font-size:16px;line-height:1.15}
.yrsel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}.yrsel .sec{margin:0;text-align:center;flex:1}.yrsel .ok{color:#7BFFB0}
.arw{width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:28px;font-weight:700;line-height:1;padding:0 0 4px;box-shadow:0 3px 0 var(--ink)}.arw:disabled{opacity:.3;box-shadow:none}
.dailybar{display:block;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:12px;background:#FFF3C4;padding:7px 10px;margin-bottom:12px;font-size:14px;cursor:pointer}.dailybar b{font-weight:700}
.sub{margin:-4px 4px 12px;font-size:14px;font-weight:500}
.rc,.rp,.radd{border:2px solid var(--ink);border-radius:999px;background:#fff;min-height:34px;padding:2px 10px;font-size:15px}.rc.on{background:var(--yel)}.radd{opacity:.7;font-size:14px}.rp{min-width:44px}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}.mine .codebox{grid-column:1/-1;margin:0;text-align:left;background:#F4F7FA;border:2.5px solid var(--ink);border-radius:12px}
.exam{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px;text-align:left;background:var(--pap)}
.exam svg{width:52px;height:52px;flex:none}.exam b{font-size:19px;font-weight:600;display:block}.exam small{font-size:14px}
.exam.locked{opacity:.65}
.fine{text-align:center;font-size:13px;color:var(--ink);margin-top:18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tag{font-weight:600;font-size:15px;background:var(--c);border:3px solid var(--ink);border-radius:999px;padding:4px 12px}
.order{padding:10px 14px;margin-bottom:12px;background:var(--pap)}
.order b{font-size:14px;font-weight:600;opacity:.65}.order p{margin:2px 0 0;font-size:16px}
.stage{padding:8px;margin-bottom:12px;background:#E8F7FF}
.stage svg{display:block;width:100%;height:auto;touch-action:manipulation}
.msg{min-height:24px;font-size:16px;margin:12px 2px 0}
.msg.bad{background:#FFE3E3;border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.msg.ok{background:#DDF7E6;border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{flex:1 1 30%;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 8px;font-size:15px;font-weight:500;min-height:46px;display:flex;align-items:center;gap:6px;justify-content:center}
.chip i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.chip.sel{background:var(--yel);transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.meter{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:12px;background:var(--yel)}
.lcd{flex:none;width:118px;background:#C8E6B0;border:3px solid var(--ink);border-radius:10px;font:700 28px/1 "Courier New",monospace;text-align:center;padding:10px 4px}
.meter p{margin:0;font-size:15px}
.opts{display:grid;gap:10px}
.opts .btn{text-align:left;font-size:17px;background:#fff}
.opts .btn.right{background:#BFF0CF}.opts .btn.wrong{background:#FFC9C9}.opts .btn.wrong:disabled,.opts .btn:disabled{opacity:.75}
.hint{font-size:15px;margin:0 2px 10px}
.circ{padding:10px;margin-bottom:10px;transition:background .2s}
.circ.over{background:#FFE1E1;animation:wob .35s infinite alternate}
.circ.trip{background:#D8DCE2}
@media (prefers-reduced-motion:reduce){.circ.over{animation:none}}
@keyframes wob{to{transform:translateX(2px)}}
.ch{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.ch span{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:6px 0}
.bar div{height:100%;transition:width .15s}
.fuse{height:8px;border-radius:9px;background:var(--red);margin-bottom:6px}
.loads{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.ld{border:3px solid var(--ink);border-radius:10px;background:var(--pap);font-size:14px;font-weight:500;padding:4px 8px;min-height:38px;white-space:nowrap}
.ld.hot{background:#FFD3A8}
.gamehud{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px;margin-bottom:10px;padding:8px 12px}
.hearts svg{width:26px;height:26px;margin-left:2px}
.qcard{padding:16px;margin-bottom:12px}
.qcard h3{margin:0 0 4px;font-size:15px;font-weight:600;opacity:.65}
.qcard p.q{font-size:20px;font-weight:500;margin:0;line-height:1.3}
.dots{display:flex;gap:5px;justify-content:center;margin:0 0 10px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.r{background:var(--grn)}.dots i.w{background:var(--red)}.dots i.c{background:var(--yel)}
.expl{margin-top:12px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--pap);font-size:16px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:grid;gap:10px}
.mb{border:3px solid var(--ink);border-radius:14px;background:#fff;min-height:58px;padding:6px 8px;font-size:15px;font-weight:500;box-shadow:0 3px 0 var(--ink)}
.mb.sel{background:var(--yel)}.mb.done{background:#BFF0CF;opacity:.7;box-shadow:none}.mb.no{background:#FFC9C9;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.modal{position:fixed;inset:0;background:#1B2A41aa;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.res{width:min(420px,100%);padding:18px;text-align:center;background:#fff}
.res h2{font-size:30px;margin:0;font-weight:700}
.earn{font-size:30px;font-weight:700;color:#1E8C4C;margin:2px 0 8px}
.why{text-align:left;background:var(--pap);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.why b{font-weight:600}.why p{margin:4px 0 0;font-size:16px}
.title{text-align:center;padding-top:6vh}
.title svg.logo{width:150px;height:150px}
.title h1{font-size:60px;line-height:1;margin:6px 0 4px;color:var(--yel);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);font-weight:700}
.title p{font-size:19px;font-weight:500;margin:6px auto 22px;max-width:320px}
.link{background:none;border:0;text-decoration:underline;font-size:15px;margin-top:16px;display:block;margin-inline:auto;min-height:44px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf{position:absolute;top:-20px;width:12px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.pulse{animation:pl .8s infinite alternate}
@keyframes pl{to{opacity:.35}}
</style>

<body>
<div id="app"></div>
<div id="fx"></div>
<script>
{
const $=s=>document.querySelector(s);
const app=$('#app');
const INK='#1B2A41';
const KEY='sparkup-v1';
let S={cash:0,earned:0,xp:0,year:1,stars:{},exams:{},mute:false,view:0,look:{hat:'yellow'},owned:{}};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=Object.assign(S,d)}catch(e){}
if(!S.exams)S.exams={};if(S.exam&&!S.exams[1])S.exams[1]=1;
if(!S.look)S.look={hat:'yellow'};if(!S.owned)S.owned={};S.earned=Math.max(S.earned||0,S.cash||0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queueBackup()};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let AC=null;
function snd(f,d,t,v){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{snd(660,.1);setTimeout(()=>snd(990,.18),90)};
const bad=()=>snd(130,.3,'sawtooth',.06);
const tick=()=>snd(560,.05,'triangle',.05);
const zap=()=>{snd(90,.35,'sawtooth',.08);setTimeout(()=>snd(60,.3,'square',.06),80)};

function wiring(W,T,st){
 const svg=$('#rc');
 const wp=k=>{const w=W[k],t=T[st.map[k]],side=t.x<180?-1:t.x>180?1:0;return `M${w.x} 334 C${w.x} 300 ${t.x+side*46} ${t.y+44} ${t.x} ${t.y}`};
 function draw(){
  let wg='',sg='',tg='';
  for(const k in W){const w=W[k];const d=st.map[k]?wp(k):`M${w.x} 334 L${w.x} 318`;
   wg+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${w.c}" stroke-width="7" stroke-linecap="round"/>`;
   if(!st.map[k])sg+=`<circle cx="${w.x}" cy="316" r="${st.sel===k?13:9}" fill="${w.c}" stroke="${INK}" stroke-width="3" ${st.sel===k?'class="pulse"':''}/>`;
   sg+=`<circle data-w="${k}" cx="${w.x}" cy="322" r="18" fill="transparent"/>`}
  for(const k in T){const t=T[k],left=t.x<=180;
   tg+=`<circle cx="${t.x}" cy="${t.y}" r="15" fill="${t.c}" stroke="${INK}" stroke-width="3.5"/><path d="M${t.x-8} ${t.y}h16" stroke="${t.dark?'#fff':INK}" stroke-width="3" stroke-linecap="round"/>${st.sel&&!st.done?`<circle cx="${t.x}" cy="${t.y}" r="22" fill="none" stroke="#FFC93C" stroke-width="4" class="pulse"/>`:''}<text x="${t.x+(left?-24:24)}" y="${t.y+5}" text-anchor="${left?'end':'start'}" font-size="14" font-weight="600" fill="${INK}">${t.n}</text><circle data-t="${k}" cx="${t.x}" cy="${t.y}" r="23" fill="transparent"/>`}
  $('#wg').innerHTML=wg;$('#tg').innerHTML=tg;$('#sg').innerHTML=sg;
  $('#chips').innerHTML=Object.keys(W).map(k=>`<button class="chip${st.sel===k?' sel':''}" data-w="${k}"><i style="background:${W[k].c}"></i>${W[k].n}${st.map[k]?' &rarr; '+(T[st.map[k]].f||T[st.map[k]].n):''}</button>`).join('');
  $('#flip').disabled=Object.keys(st.map).length<Object.keys(W).length||st.done;
 }
 function pickW(k){if(st.done)return;st.sel=st.sel===k?null:k;tick();draw()}
 function pickT(t){if(st.done)return;if(!st.sel){const k=Object.keys(st.map).find(x=>st.map[x]===t);if(k){st.sel=k;tick();draw()}return}
  const prev=st.map[st.sel],other=Object.keys(st.map).find(x=>st.map[x]===t&&x!==st.sel);
  if(other){if(prev)st.map[other]=prev;else delete st.map[other]}
  st.map[st.sel]=t;st.sel=null;tick();draw()}
 svg.addEventListener('click',e=>{const el=e.target.closest('[data-w],[data-t]');if(!el)return;el.dataset.w?pickW(el.dataset.w):pickT(el.dataset.t)});
 $('#chips').onclick=e=>{const b=e.target.closest('[data-w]');if(b)pickW(b.dataset.w)};
 return draw;
}

function badgeAt(txt,col){$('#fxg').innerHTML+=`<g><rect x="60" y="138" width="240" height="44" rx="14" fill="${col}" stroke="${INK}" stroke-width="3.5"/><text x="180" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="${INK}">${txt}</text></g>`}
const BOXBG=`<rect x="68" y="8" width="224" height="326" rx="20" fill="#A7B1BD" stroke="${INK}" stroke-width="4"/><rect x="82" y="22" width="196" height="298" rx="12" fill="#8592A1"/><rect x="140" y="16" width="80" height="308" rx="10" fill="#CDD3DA" stroke="${INK}" stroke-width="3"/><circle cx="180" cy="32" r="6" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;
const FXG='<g id="wg"></g><g id="sg"></g><g id="tg"></g><g id="fxg"></g>';
const WIREUI=`<p class="hint">Tap a wire, then tap a screw.</p><div class="chips" id="chips"></div><div class="row"><button class="btn alt" id="hint">Hint</button><button class="btn go" id="flip" disabled>Flip breaker ON</button></div><div class="msg" id="msg"></div>`;

/* ---------- INSTALL (year 1): receptacle or GFCI, shuffled ---------- */
function install(){
 const j=J('install'),gf=Math.random()<.5,xs=shuffle([135,180,225]);
 const W={black:{c:'#262626',x:xs[0],n:'Black'},white:{c:'#F7F7F7',x:xs[1],n:'White'},bare:{c:'#D0843F',x:xs[2],n:'Bare copper'}};
 const T=gf?{lsil:{x:112,y:118,c:'#D5DAE1',n:'LINE',f:'Line silver'},lbr:{x:248,y:118,c:'#E8B64C',n:'LINE',f:'Line brass'},dsil:{x:112,y:214,c:'#D5DAE1',n:'LOAD',f:'Load silver'},dbr:{x:248,y:214,c:'#E8B64C',n:'LOAD',f:'Load brass'},green:{x:180,y:290,c:'#3DBE5B',n:'Green'}}
  :{silver:{x:112,y:165,c:'#D5DAE1',n:'Silver'},brass:{x:248,y:165,c:'#E8B64C',n:'Brass'},green:{x:180,y:290,c:'#3DBE5B',n:'Green'}};
 const HOT=gf?'lbr':'brass',NEU=gf?'lsil':'silver',LOADS=['dsil','dbr'];
 const st={sel:null,map:{},done:false};let tries=0,hint=false;
 const outlet=(y,h)=>`<rect x="144" y="${y}" width="72" height="${h}" rx="22" fill="#fff" stroke="${INK}" stroke-width="3"/><rect x="157" y="${y+h*.2}" width="8" height="${h*.32}" rx="2" fill="${INK}"/><rect x="195" y="${y+h*.23}" width="7" height="${h*.26}" rx="2" fill="${INK}"/><path d="M174 ${y+h*.85}v-5a6 6 0 0 1 12 0v5z" fill="${INK}"/>`;
 const face=gf?`${outlet(62,68)}<rect x="146" y="140" width="32" height="20" rx="5" fill="#fff" stroke="${INK}" stroke-width="3"/><rect x="182" y="140" width="32" height="20" rx="5" fill="#FF8A8A" stroke="${INK}" stroke-width="3"/><text x="180" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">TEST  RESET</text>${outlet(190,68)}`:`${outlet(78,78)}${outlet(172,78)}`;
 shell(j,gf?'The bathroom receptacle needs to be a GFCI. It\'s the only receptacle on this circuit, so nothing is downstream. The breaker is OFF and locked out. Land the wires, then flip the breaker.':'The kitchen receptacle is cracked. The breaker is OFF and locked out. Land each wire on the right screw, then flip the breaker back on.',
 `<div class="stage card"><svg id="rc" viewBox="0 0 360 380" aria-label="${gf?'GFCI receptacle with line and load terminals':'Receptacle with three terminal screws'} and a cable with three wires">${BOXBG}
 <rect x="122" y="52" width="116" height="228" rx="28" fill="#FFF8E7" stroke="${INK}" stroke-width="4"/>${face}
 <rect x="102" y="334" width="156" height="34" rx="14" fill="#F4F1EA" stroke="${INK}" stroke-width="3"/>
 <text x="180" y="356" font-size="14" font-weight="600" fill="${INK}" text-anchor="middle">${gf?'12/2':'14/2'} with ground</text>${FXG}</svg></div>${WIREUI}`);
 const draw=wiring(W,T,st);
 $('#hint').onclick=()=>{hint=true;tick();const m=$('#msg');m.className='msg ok';m.innerHTML=gf?'<b>Hint:</b> Power from the panel goes on LINE. Black to the line brass, white to the line silver, bare to green.':'<b>Hint:</b> Black to brass. White to light (silver). Bare to green.'};
 $('#flip').onclick=()=>{
  tries++;const b=st.map.black,w=st.map.white,g=st.map.bare,m=$('#msg');$('#fxg').innerHTML='';
  if(b===HOT&&w===NEU&&g==='green'){st.done=true;draw();
   $('#fxg').innerHTML=`<rect x="122" y="52" width="116" height="228" rx="28" fill="#FFE070" opacity=".45" class="pulse"/>`;badgeAt(gf?'GFCI: RESET OK':'Tester: CORRECT','#BFF0CF');
   m.className='msg ok';m.textContent=gf?'Power on. You press TEST, it trips. Press RESET, power comes back. Perfect.':'Power on. The plug-in tester shows correct wiring.';
   setTimeout(()=>result(j,Math.max(1,(hint?2:3)-(tries-1)),gf?'A GFCI has LINE terminals for the power coming from the panel and LOAD terminals for protecting outlets further down the line. The feed always goes on LINE. Black still goes to brass, white to silver, bare to green. Wire it backwards and most GFCIs won\'t reset, which is your clue.':'Black (hot) goes to the brass screw, white (neutral) to the silver screw, and bare or green (ground) to the green screw. Polarity matters: the wide slot is the neutral, so the threaded shell of a lamp socket stays safe instead of being live.'),1100);return}
  m.className='msg bad';
  if(b==='green'){zap();if(!st.sh){st.sh=1;failPost(j,'caused a dead short 💥')}sparksAt(T.green.x,T.green.y);badgeAt('BREAKER TRIPPED','#FFC9C9');m.innerHTML='<b>Bang!</b> The hot wire is on the green screw. That screw bonds to the strap and the grounded metal box, so hot went straight to ground: a dead short. The breaker tripped. Fix it and try again.'}
  else if(g!=='green'){zap();sparksAt(T[g].x,T[g].y);badgeAt('WIRING FAULT','#FFC9C9');m.innerHTML='<b>Wiring fault.</b> The bare ground is on a screw that carries normal current. The ground should only carry current during a fault, so it can safely trip the breaker. Never use it as a hot or a neutral.'}
  else if(gf&&(LOADS.includes(b)||LOADS.includes(w))){bad();badgeAt('WON\'T RESET','#FFC9C9');m.innerHTML='<b>No power, and it won\'t reset.</b> Power from the panel is on the LOAD side. LOAD is only for feeding other outlets you want protected. The feed must land on LINE.'}
  else{bad();badgeAt('HOT/NEU REVERSED','#FFC9C9');m.innerHTML='<b>It works, but it\'s wrong.</b> Hot is on the silver screw, so the wide slot is now hot. A lamp plugged in here would have a live socket shell. That\'s reversed polarity: a shock hazard.'}
  m.innerHTML+=' The breaker is back OFF.';
 };
 draw();
}

/* ---------- EMERGENCY ---------- */
function emerg(){
 const j=J('emerg');
 const AP=[['Space heater',1500],['Hair dryer',1500],['Microwave',1000],['Coffee maker',1000],['Toaster',900],['Vacuum',1200],['Blender',600],['TV',200],['Lamp',60],['Laptop',90],['Game console',150],['Fan',100],['Slow cooker',250],['Kettle',1200]];
 shell(j,'Big party, old wiring. Circuits are overloading! When one flashes red, tap an appliance to move it to a circuit with room before the breaker trips.',
 `<div class="qcard card"><p class="q" style="font-size:18px">Amps = watts &divide; 120 V. A 15 A circuit holds about 1,800 W. A 20 A circuit holds about 2,400 W. You have 45 seconds and 3 lives.</p></div><button class="btn big" id="st" style="width:100%">Start shift</button>`);
 $('#st').onclick=()=>{tick();run()};
 function run(){
  const CI=[{n:'Kitchen',r:20},{n:'Living room',r:15},{n:'Bedroom',r:15},{n:'Garage',r:20}].map(c=>Object.assign(c,{L:[],fuse:0,trip:0}));
  let t=45,hearts=3,score=0,next=1,uid=0,over=false;
  app.querySelector('.qcard').remove();$('#st').remove();
  app.insertAdjacentHTML('beforeend',`<div class="gamehud card"><span id="tm">45s</span><span class="hearts" id="hh"></span><span id="sc">0</span></div><div id="pn"></div><div class="msg" id="msg"></div>`);
  const amps=c=>c.L.reduce((s,l)=>s+l[1],0)/120;
  function spawn(){const ok=CI.filter(c=>!c.trip&&c.L.length<5);if(!ok.length)return;const c=ok[Math.floor(Math.random()*ok.length)];
   const heavy=Math.random()<.55,pool=AP.filter(a=>heavy?a[1]>=900:a[1]<900);const a=pool[Math.floor(Math.random()*pool.length)];c.L.push([a[0],a[1],++uid])}
  function render(){
   $('#tm').textContent=Math.ceil(t)+'s';$('#sc').textContent=score+' pts';
   $('#hh').innerHTML=[0,1,2].map(i=>HEART.replace('F',i<hearts?'#FF5A5A':'#E3E7EC')).join('');
   $('#pn').innerHTML=CI.map((c,i)=>{const a=amps(c),pc=Math.min(100,a/c.r*100),ov=a>c.r;
    if(c.trip)return `<div class="circ card trip"><div class="ch">${c.n} <span>${c.r} A breaker</span></div><p style="margin:6px 0 0;font-weight:600">TRIPPED. Resetting&hellip;</p></div>`;
    return `<div class="circ card${ov?' over':''}"><div class="ch">${c.n} <span>${a.toFixed(1)} / ${c.r} A</span></div><div class="bar"><div style="width:${pc}%;background:${ov?'#FF5A5A':pc>80?'#FFC93C':'#35C76F'}"></div></div>${ov?`<div class="fuse" style="width:${100-c.fuse/3.5*100}%"></div>`:''}<div class="loads">${c.L.map(l=>`<button class="ld${l[1]>=900?' hot':''}" data-c="${i}" data-u="${l[2]}">${l[0]} ${(l[1]/120).toFixed(1)}A</button>`).join('')}</div></div>`}).join('')}
  $('#pn').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-u]');if(!b||over)return;e.preventDefault();
   const src=CI[+b.dataset.c],li=src.L.findIndex(l=>l[2]===+b.dataset.u);if(li<0)return;const l=src.L[li],need=l[1]/120,wasOver=amps(src)>src.r;
   let best=null,room=-1;CI.forEach(c=>{if(c===src||c.trip||c.L.length>=5)return;const r=c.r-amps(c);if(r>=need&&r>room){room=r;best=c}});
   src.L.splice(li,1);const m=$('#msg');
   if(best){best.L.push(l);tick();if(wasOver)score+=15;m.className='msg ok';m.textContent=`Moved the ${l[0].toLowerCase()} to the ${best.n.toLowerCase()} circuit.`}
   else{snd(300,.08,'triangle');m.className='msg';m.textContent=`No circuit had room, so the ${l[0].toLowerCase()} got unplugged.`}
   if(wasOver&&amps(src)<=src.r)src.fuse=0;render()});
  let acc=0;
  timers.push(setInterval(()=>{if(over)return;t-=.1;acc+=.1;next-=.1;
   if(next<=0){spawn();next=Math.max(.9,2.4-(45-t)*.035)}
   CI.forEach(c=>{if(c.trip){c.trip-=.1;if(c.trip<=0)c.trip=0;return}
    if(amps(c)>c.r){c.fuse+=.1;if(c.fuse>=3.5){c.trip=2;c.fuse=0;c.L=[];hearts--;zap();const m=$('#msg');m.className='msg bad';m.textContent=`The ${c.n.toLowerCase()} breaker tripped! The breaker did its job, but the party went dark.`}}

   if(acc>=1){acc=0;score+=CI.filter(c=>!c.trip).length}
   render();
   if(hearts<=0||t<=0){over=true;stop();
    setTimeout(()=>result(j,Math.max(0,hearts),'Every appliance adds amps to its circuit. A 15 A breaker holds about 1,800 W at 120 V (15 &times; 120). Two heat-making appliances like a heater and a hair dryer will trip it. That\'s why kitchens get 20 A circuits and big loads often get their own circuit. A tripped breaker isn\'t the problem. It\'s protecting the wire from overheating. And if a load runs 3 hours or more, it\'s a continuous load: keep it to 80% of the breaker, like 12 A on a 15 A circuit.',`<p style="margin:0 0 4px">Score: ${score} &middot; Lives left: ${Math.max(0,hearts)}</p>`),500)}
  },100));
  spawn();spawn();render();
 }
}

/* ---------- LAYOUT PUZZLE (shared) ---------- */
function puzzle(cfg){
 const j=J(cfg.id);const N=5,C=70;
 const rot=m=>((m<<1)|(m>>3))&15;
 const mx=Math.random()<.5,my=Math.random()<.5;
 const tm=m=>{if(mx)m=(m&5)|(m&2?8:0)|(m&8?2:0);if(my)m=(m&10)|(m&1?4:0)|(m&4?1:0);return m};
 const tk=k=>{let[r,c]=k.split(',').map(Number);if(mx)c=4-c;if(my)r=4-r;return r+','+c};
 const SOL={};for(const k in cfg.sol){const s=cfg.sol[k];SOL[tk(k)]=Object.assign({},s,{m:tm(s.m)})}
 const PAN=tk(cfg.panel),TGT=cfg.targets.map(tk),[pr,pc]=PAN.split(',').map(Number);
 const DEC=[3,10,5,6,12,9,7,11,14,5,3,10];
 const g=[];let par=0,moves=0,solved=false,di=0;
 for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++){const s=SOL[r+','+c];
  if(s&&s.f){g[r][c]={f:s.f,m:s.m};continue}
  let m=s?s.m:DEC[di++%DEC.length];const sol=m;
  if(s){let k;do{k=1+Math.floor(Math.random()*3);m=sol;for(let i=0;i<k;i++)m=rot(m)}while(m===sol);
   let need=0,x=m;while(x!==sol){x=rot(x);need++}par+=need}
  else{const k=Math.floor(Math.random()*4);for(let i=0;i<k;i++)m=rot(m)}
  g[r][c]={m}}}
 shell(j,cfg.order,`<div class="gamehud card"><span>Moves: <b id="mv">0</b></span><span>Par: ${par}</span></div>
 <div class="stage card"><svg id="lg" viewBox="0 0 ${N*C} ${N*C}" aria-label="Wire tile puzzle"></svg></div><div id="code"></div>`);

function inspect2(){
 const j=J('inspect2');
 shell(j,'Inspection is tomorrow. Walk the job and call each item SAFE or HAZARD. You have 40 seconds and 3 strikes. Streaks earn bonus points.',`<button class="btn big" id="st" style="width:100%">Start walkthrough</button>`);
 $('#st').onclick=()=>{tick();run()};
 function run(){
  const deck=shuffle(INS);let i=0,t=40,strikes=0,score=0,combo=0,over=false,lock=false,answered=0,right=0;
  $('#st').remove();
  app.insertAdjacentHTML('beforeend',`<div class="gamehud card"><span id="tm">40s</span><span class="hearts" id="hh"></span><span id="sc">0</span></div><div id="ic"></div><div class="row" style="margin-top:12px"><button class="btn" id="bs" style="background:#35C76F;color:#fff;-webkit-text-stroke:.4px ${INK};font-size:22px;min-height:64px">SAFE</button><button class="btn" id="bh" style="background:#FF5A5A;color:#fff;-webkit-text-stroke:.4px ${INK};font-size:22px;min-height:64px">HAZARD</button></div><div class="msg" id="msg"></div>`);
  function hdr(){$('#tm').textContent=Math.ceil(t)+'s';$('#sc').textContent=score+' pts';$('#hh').innerHTML=[0,1,2].map(k=>HEART.replace('F',k<3-strikes?'#FF5A5A':'#E3E7EC')).join('')}
  function card(){const c=deck[i];$('#ic').innerHTML=`<div class="qcard card" style="min-height:150px;display:flex;flex-direction:column;justify-content:center"><h3>Item ${i+1}${combo>1?' &middot; streak x'+Math.min(combo,5):''}</h3><p class="q" style="font-size:22px">${c[0]}</p></div>`}
  function answer(h){if(over||lock)return;const c=deck[i],ok=(h===c[1]),m=$('#msg');answered++;
   if(ok){right++;combo++;score+=10*Math.min(combo,5);tick();m.className='msg ok';m.textContent='Last one: '+(c[1]?'Hazard! ':'Safe. ')+c[2]}
   else{combo=0;strikes++;bad();m.className='msg bad';m.textContent='Last one: '+(c[1]?'That was a hazard. ':'That one was actually fine. ')+c[2]}
   i++;hdr();
   if(strikes>=3||i>=deck.length){end();return}
   if(!ok){lock=true;setTimeout(()=>{lock=false;card()},1200)}else card()}
  $('#bs').onclick=()=>answer(0);$('#bh').onclick=()=>answer(1);
  function end(){if(over)return;over=true;stop();const st=strikes>=3?0:3-strikes;
   setTimeout(()=>result(j,st,'Inspectors look for the same things every time: covers on boxes, plates on devices, the right wire on the right breaker, GFCI where water is, one wire per screw, and no cords doing the job of permanent wiring. Catch them yourself and you pass the first time.',`<p style="margin:0 0 4px">Score: ${score} &middot; Correct: ${right}/${answered}</p>`),900)}
  timers.push(setInterval(()=>{if(over)return;t-=.1;hdr();if(t<=0)end()},100));
  hdr();card();
 }
}

/* ---------- YEAR 2: ROUGH-IN STAPLES ---------- */
function roughin(){
 const j=J('roughin'),L=(9+Math.floor(Math.random()*7))*12;let st=[],tries=0;
 const X=p=>20+p/L*320;
 let need=1,pos=12;while(pos<L-12){pos+=54;need++}
 shell(j,`Rough-in inspection tomorrow. A ${L/12} ft run of NM cable goes between two boxes. Tap the cable to add staples (tap one again to remove it), then call the inspector.`,
 `<div class="gamehud card"><span>Staples: <b id="nst">0</b></span><span>Run: ${L/12} ft</span></div>
 <div class="stage card"><svg id="rw" viewBox="0 0 360 150" style="display:block;width:100%;touch-action:manipulation" aria-label="Wall with a cable run between two boxes"></svg></div>
 <p class="hint">Rule of thumb: staple within 12 in. of each box, then at least every 4½ ft.</p>
 <button class="btn go" id="insp" style="width:100%">Call the inspector</button><div class="msg" id="msg"></div>`);
 let bad1=null;
 function draw(){let h=`<rect x="0" y="10" width="360" height="110" fill="#F2D8A7"/>`;
  for(let x=0;x<=L;x+=16)h+=`<rect x="${X(x)-4}" y="10" width="8" height="110" fill="#E3BF7E" stroke="#B88B45" stroke-width="1"/>`;
  if(bad1)h+=`<rect x="${X(bad1[0])}" y="56" width="${X(bad1[1])-X(bad1[0])}" height="28" fill="#FF5A5A" opacity=".45"/>`;
  h+=`<path d="M${X(0)} 70H${X(L)}" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M${X(0)} 70H${X(L)}" stroke="#F4F1EA" stroke-width="6" stroke-linecap="round"/>`;
  h+=`<rect x="4" y="48" width="22" height="44" rx="4" fill="#9FD8F5" stroke="${INK}" stroke-width="3"/><rect x="334" y="48" width="22" height="44" rx="4" fill="#9FD8F5" stroke="${INK}" stroke-width="3"/>`;
  st.forEach(p=>{h+=`<path d="M${X(p)-6} 60v14h12V60" fill="none" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M${X(p)-6} 60v14h12V60" fill="none" stroke="#B4BCC6" stroke-width="2" stroke-linejoin="round"/>`});
  for(let f=0;f<=L/12;f+=2)h+=`<text x="${X(f*12)}" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="${INK}">${f}'</text>`;
  h+=`<rect x="0" y="0" width="360" height="150" fill="transparent" id="hit"/>`;
  $('#rw').innerHTML=h;$('#nst').textContent=st.length}
 $('#rw').addEventListener('click',e=>{const r=$('#rw').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*360;let p=Math.round(((x-20)/320*L)/6)*6;p=Math.max(3,Math.min(L-3,p));
  const near=st.findIndex(q=>Math.abs(q-p)<=6);if(near>=0)st.splice(near,1);else st.push(p);st.sort((a,b)=>a-b);bad1=null;tick();draw()});
 $('#insp').onclick=()=>{tries++;const m=$('#msg');const pts=[0,...st,L];let err=null;
  if(!st.length)err=[0,L,'No staples at all. NM cable has to be secured.'];
  else if(st[0]>12)err=[0,st[0],`The first staple is ${st[0]} in. from the box. It has to be within 12 in.`];
  else if(L-st[st.length-1]>12)err=[st[st.length-1],L,`The last staple is ${L-st[st.length-1]} in. from the box. It has to be within 12 in.`];
  else for(let i=1;i<st.length;i++)if(st[i]-st[i-1]>54){err=[st[i-1],st[i],`There's ${st[i]-st[i-1]} in. between two staples. The max is 54 in. (4½ ft).`];break}
  if(err){bad1=[err[0],err[1]];draw();bad();m.className='msg bad';m.innerHTML='<b>Red tag.</b> '+err[2];return}
  good();m.className='msg ok';m.innerHTML=`<b>Passed!</b> ${st.length} staples (the fewest that work here is ${need}).`;$('#insp').disabled=true;
  const stars=tries===1&&st.length<=need+1?3:tries<=2?2:1;
  setTimeout(()=>steps(j,'The inspector has one more question while he\'s here.',[{h:'Inspector',q:'You bored a hole for the cable, and its edge is only 1 in. from the face of the stud. What does it need?',a:['A steel nail plate over it','Nothing, it\'s inside the wall','Electrical tape','A bigger hole'],c:0,e:'When the hole\'s edge is closer than 1¼ in. to the face of the stud, cover it with a steel plate at least 1/16 in. thick, so drywall screws and nails can\'t hit the cable.'}],m2=>result(j,Math.max(1,stars-m2),'NM cable gets secured within 12 in. of every box and at least every 4½ ft along the run. Keep holes 1¼ in. back from the face of the stud, or add a steel nail plate. Inspectors check this before the drywall goes up, so get it right the first time.')),1200)};
 draw();
}

  {q:'How do you get 240 V at the panel?',a:['A 2-pole breaker that connects to both hot legs','Two single-pole breakers on the same leg','A single-pole breaker with a bigger wire','A GFCI breaker'],c:0,e:'A 2-pole breaker grabs both hot legs (buses), and the voltage between them is 240 V. Its handles are tied so both legs shut off together.'},

function subpanel(){

 const W={blk:{c:'#262626',x:108,n:'Black (hot)'},red:{c:'#E23B3B',x:148,n:'Red (hot)'},wht:{c:'#F7F7F7',x:212,n:'White (neutral)'},bare:{c:'#D0843F',x:252,n:'Bare (ground)'}};

 <rect x="90" y="236" width="70" height="18" rx="4" fill="#D5DAE1" stroke="${INK}" stroke-width="3"/><rect x="200" y="236" width="70" height="18" rx="4" fill="#9BE3AE" stroke="${INK}" stroke-width="3"/>
 <g id="bond"></g>
 <rect x="102" y="334" width="156" height="34" rx="14" fill="#F4F1EA" stroke="${INK}" stroke-width="3"/><text x="180" y="356" font-size="13" font-weight="600" fill="${INK}" text-anchor="middle">4-wire feeder from main</text>${FXG}</svg></div>
 <button class="btn alt" id="bt" style="width:100%;margin-bottom:12px"></button>${WIREUI}`);
 const draw=wiring(W,T,st);
 function db(){$('#bond').innerHTML=bond?`<circle cx="125" cy="275" r="10" fill="#3DBE5B" stroke="${INK}" stroke-width="3"/><path d="M119 275h12" stroke="${INK}" stroke-width="2.5"/><text x="140" y="280" font-size="13" font-weight="700" fill="#fff">bond screw</text>`:'';$('#bt').textContent=bond?'Bonding screw: INSTALLED (tap to remove)':'Bonding screw: REMOVED (tap to install)'}

  const hotBad=['blk','red'].find(k=>mp[k]==='nb'||mp[k]==='gb');

  if(mp.wht!=='nb'||mp.bare!=='gb'){bad();badgeAt('INSPECTOR: FAIL','#FFC9C9');m.innerHTML='<b>Neutral and ground are swapped.</b> Normal current would ride the ground wire, and the ground can\'t do its job in a fault. White goes on the neutral bar, bare on the ground bar.';return}

const QB={1:QB1,2:QB2},MATCH={1:MATCH1,2:MATCH2};

function exam(yr){
 const pool=QB[yr].filter(q=>{const s=J(q[4]);return s&&s.yr<=yr});
 const N=Math.min(8,pool.length),TOT=N+5,PASS=Math.ceil(TOT*.75);
 const qs=shuffle(pool).slice(0,N).map(q=>{const ord=shuffle([0,1,2,3]);return{q:q[0],a:ord.map(i=>q[1][i]),c:ord.indexOf(q[2]),e:q[3],src:q[4]}});
 let qi=0,right=0,res=[];
 const top=`<div class="top"><button class="btn alt sm" id="back">&larr; Quit</button><span class="tag" style="--c:#FFC93C">Year ${yr} exam</span></div>`;
 function showQ(){const q=qs[qi];let answered=false;
  app.innerHTML=top+`<div class="dots">${qs.map((_,i)=>`<i class="${res[i]===1?'r':res[i]===0?'w':i===qi?'c':''}"></i>`).join('')}</div>
  <div class="qcard card"><h3>Question ${qi+1} of ${N}</h3><p class="q">${q.q}</p></div>
  <div class="opts" id="ao">${q.a.map((a,i)=>`<button class="btn" data-i="${i}">${a}</button>`).join('')}</div><div id="ex"></div>`;
  $('#back').onclick=()=>{tick();board()};
  $('#ao').onclick=e=>{const b=e.target.closest('[data-i]');if(!b||answered)return;answered=true;const i=+b.dataset.i,ok=i===q.c;
   res[qi]=ok?1:0;if(ok){right++;good()}else bad();
   $('#ao').querySelectorAll('button').forEach((x,k)=>{if(k===q.c)x.classList.add('right');else if(k===i)x.classList.add('wrong')});
   $('#ex').innerHTML=`<div class="expl"><b>${ok?'Right!':'Not quite.'}</b> ${q.e}${ok?'':`<br><small style="font-weight:600">Review this job: ${J(q.src).title}</small>`}</div><button class="btn" id="nx" style="width:100%;margin-top:12px">${qi<N-1?'Next question':'On to the match-up'}</button>`;
   $('#nx').onclick=()=>{tick();qi++;qi<N?showQ():match()};
   $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'})}}
 function match(){
  const L=shuffle(MATCH[yr].map((p,i)=>[p[0],i])),R=shuffle(MATCH[yr].map((p,i)=>[p[1],i]));let sl=null,mist=0,got=0;
  app.innerHTML=top+`<div class="qcard card"><h3>Final round: match-up</h3><p class="q">Tap an item on the left, then its match on the right.</p></div>
  <div class="match"><div class="col" id="ml">${L.map(x=>`<button class="mb" data-i="${x[1]}">${x[0]}</button>`).join('')}</div><div class="col" id="mr">${R.map(x=>`<button class="mb" data-i="${x[1]}">${x[0]}</button>`).join('')}</div></div><p class="msg" id="msg">Mistakes: 0</p>`;
  $('#back').onclick=()=>{tick();board()};
  $('#ml').onclick=e=>{const b=e.target.closest('.mb');if(!b||b.classList.contains('done'))return;$('#ml').querySelectorAll('.mb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sl=b;tick()};
  $('#mr').onclick=e=>{const b=e.target.closest('.mb');if(!b||!sl||b.classList.contains('done'))return;
   if(b.dataset.i===sl.dataset.i){b.classList.add('done');sl.classList.remove('sel');sl.classList.add('done');sl=null;got++;good();if(got===5)setTimeout(finish,500)}
   else{mist++;bad();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#msg').textContent='Mistakes: '+mist}};
  function finish(){const mp=Math.max(0,5-mist),tot=right+mp,pass=tot>=PASS;let bonusTxt='';
   if(pass&&!S.exams[yr]){S.exams[yr]=1;S.year=Math.max(S.year,yr+1);const bn=200*yr;S.cash+=bn;S.earned=(S.earned||0)+bn;bonusTxt=`You earned a ${money(bn)} bonus. `;if(yr<YMAX)S.view=yr+1;post(`${S.name} passed the Year ${yr} exam and is now a ${RANK[yr+1]}!`)}
   save();syncMe();
   if(pass){good();confetti()}else{bad();post(`${S.name} failed the Year ${yr} exam (${tot}/${TOT}). Back to the books!`)}
   const o=document.createElement('div');o.className='modal';
   o.innerHTML=`<div class="res card"><h2>${pass?'You passed!':'Not yet'}</h2><div class="earn" style="color:${pass?'#1E8C4C':'#C0392B'}">${tot} / ${TOT}</div><p style="margin:0 0 10px">Quiz: ${right}/${N} &middot; Match-up: ${mp}/5. You need ${PASS} to pass.</p><div class="why"><b>${pass?'Promoted to '+RANK[yr+1]:'Study up and try again'}</b><p>${pass?bonusTxt+(yr<YMAX?`Year ${yr+1} jobs are unlocked on the job board.`:`Year ${yr+1} jobs are coming in the next update.`):'Every question comes from a job you\'ve done. Replay the ones it pointed you to, then try again. You get a new mix of questions each time.'}</p></div><button class="btn" id="tb" style="width:100%">Job board</button></div>`;
   document.body.appendChild(o);o.querySelector('#tb').onclick=()=>{o.remove();tick();board()}}
 }
 showQ();
}

async function restore(raw){
 const code=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code.length!==10)throw new Error('A hall code is 10 letters and numbers, like ABCD-EFGH-JK.');
 if(!fb)throw new Error('Can\'t reach the hall right now. Check your connection and try again.');
 const F=fb.F;let snap;
 try{snap=await F.getDoc(F.doc(fb.db,'saves',code))}catch(e){throw new Error('Can\'t reach the hall right now. Try again in a minute.')}
 if(!snap.exists())throw new Error('No hall card matches that code. Check it and try again.');
 const {pid,data}=snap.data();let d;try{d=JSON.parse(data)}catch(e){throw new Error('That card\'s backup is damaged.')}
 await F.setDoc(F.doc(fb.db,'owners',pid),{uid:fb.uid,code});
 S=Object.assign({cash:0,earned:0,xp:0,year:1,stars:{},exams:{},view:0,look:{hat:'yellow'},owned:{}},d,{pid,code,ownerUid:fb.uid,mute:S.mute,joinPosted:1,joinedSync:1});
 saveLocal();syncMe();backup();
}

 <p class="fine" style="margin:6px 0 12px">${lk.tool?'Favorite tool: '+TOOLS[lk.tool][0]:lk.tools.length?'':'No tools yet.'}</p>
 ${mine?`<div class="mine"><button class="btn alt sm" id="psnd">Sound: ${S.mute?'off':'on'}</button><button class="btn alt sm" id="pname">Edit name</button>${S.code?`<div class="codebox"><b>Your hall code</b><small>Keep it safe. It moves your card and progress to a new phone.</small><button class="btn alt sm" id="cc">${fmtCode(S.code)}</button></div>`:''}</div>`:''}
 <button class="btn" id="pclose" style="width:100%">Close</button></div>`;
 document.body.appendChild(o);tick();
 o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelector('#pclose').onclick=()=>{o.remove();tick()};
 const sn=o.querySelector('#psnd');if(sn)sn.onclick=()=>{S.mute=!S.mute;saveLocal();sn.textContent='Sound: '+(S.mute?'off':'on');tick()};
 const pn=o.querySelector('#pname');if(pn)pn.onclick=()=>{o.remove();tick();onHall=false;signup(true)};
 const cc=o.querySelector('#cc');if(cc)cc.onclick=()=>{try{navigator.clipboard.writeText(fmtCode(S.code)).then(()=>{cc.textContent='Copied!';setTimeout(()=>{cc.textContent=fmtCode(S.code)},1500)}).catch(()=>{})}catch(e){}};
}
function hall(){
 stop();onHall=true;
 const me=S.pid,mineLive={name:S.name,year:S.year,earned:S.earned,stars:totalStars(),look:myLook(),ce:!!ceYear()};
 let mem=MEM.slice();
 if(S.name&&!mem.find(m=>m.id===me))mem.push(Object.assign({id:me||'me'},mineLive));
 mem=mem.map(m=>m.id===me?Object.assign({},m,mineLive):m);
 mem.sort((a,b)=>(+b.earned||0)-(+a.earned||0)||(+b.year||1)-(+a.year||1)||String(a.name).localeCompare(String(b.name)));
 const status=fbState==='online'?'':fbState==='connecting'?'<div class="msg">Connecting to the hall&hellip;</div>':'<div class="msg bad">The hall is offline right now. You can keep playing. Your card updates when you\'re back online.</div>';
 app.innerHTML=hud()+nav('hall')+`<h2 class="sec">${LOCAL}</h2>${status}
 <p class="sub">${mem.length} member${mem.length===1?'':'s'} &middot; ranked by career earnings &middot; tap a card</p>
 <div class="roster">${mem.map((m,i)=>{const y=Math.max(1,Math.min(7,parseInt(m.year)||1)),mine=m.id===me||m.id==='me',lk=cleanLook(m.look),has=m.earned!==undefined&&m.earned!==null;
  return `<button class="mem card cs-${lk.card}${mine?' me':''}" data-i="${i}"><span class="pos">${i+1}</span>${hatSvg(lk.hat,'width:44px;height:44px;flex:none')}<span class="mi"><b>${esc(m.name)}${mine?' <em>You</em>':''}</b><small>${RANK[y]}${m.ce?' <span class="cebadge">CE due</span>':''}</small>${lk.truck||lk.belt||lk.tool?`<span class="gear">${lk.truck?truckSvg(lk.truck,'height:20px;width:32px'):''}${lk.belt?beltSvg(lk.belt,'height:20px;width:32px'):''}${lk.tool?toolSvg(lk.tool,'height:20px;width:18px'):''}</span>`:''}</span><span class="earn2">${has?money(+m.earned||0):'<small style="font-weight:500;font-size:13px">syncing&hellip;</small>'}</span></button>`}).join('')}</div>

 <h2 class="sec" style="font-size:22px;margin-top:18px">Hall news</h2>
 <div class="card news">${newsHtml()}</div>`;
 bindHud();bindNav();bindNews();
 app.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{const m=mem[+b.dataset.i];profile(m,m.id===me||m.id==='me')});

}
function myLook(){return{hat:S.look.hat||'yellow',card:S.look.card||'plain',truck:S.look.truck||'',belt:S.look.belt||'',tool:S.look.tool||'',tools:Object.keys(TOOLS).filter(k=>S.owned['tool_'+k])}}
const JOBF={install,service,layout,emerg,bench,lockout,install2,service2,layout2,inspect2,boxfill,roughin,heater240,subpanel};
title();
initFB();
}
</script>
</body>
